name: REXX3 Challenge Automation

on:
  workflow_dispatch:

jobs:
  rexx3-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > rexx3.py << 'PYEOF'
          import subprocess
          import time
          from zoautil_py import datasets, jobs

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          SOURCE_DS = f"{USER}.SOURCE"
          PANELS_DS = f"{USER}.PANELS"

          print("=== STEP 1: Prepare Datasets (Standard LRECL=80) ===")
          # Allocate with standard mainframe attributes as per PDF instructions
          for ds in [PANELS_DS, SOURCE_DS]:
              try: datasets.delete(ds)
              except: pass
              # PDF says: RECFM: FB LRECL: 80
              res = run_tso(f"ALLOCATE DSNAME('{ds}') DSORG(PO) RECFM(F,B) LRECL(80) SPACE(5,5) TRACKS")
              print(f"Allocated {ds}: {res.strip()}")

          print("=== STEP 2: Copy DASHPNL (Panel) ===")
          try:
              datasets.copy("ZXP.PUBLIC.SOURCE(DASHPNL)", f"{PANELS_DS}(DASHPNL)")
              print("Copied DASHPNL successfully")
          except Exception as e:
              print(f"Error copying DASHPNL: {e}")
              # Fallback: Read and Write manually
              try:
                  content = datasets.read("ZXP.PUBLIC.SOURCE(DASHPNL)")
                  # Split blob if necessary
                  if '\n' not in content and len(content) > 80:
                      lines = [content[i:i+80] for i in range(0, len(content), 80)]
                      content = '\n'.join(lines)
                  datasets.write(f"{PANELS_DS}(DASHPNL)", content)
                  print("Manual copy DASHPNL successful")
              except Exception as e2:
                  print(f"Manual copy DASHPNL failed: {e2}")

          print("=== STEP 3: Process REXX3 Script ===")
          try:
              # Read the source directly from the public library
              content = datasets.read("ZXP.PUBLIC.SOURCE(REXX3)")
              print(f"Read REXX3 source: {len(content)} chars")
              
              # CRITICAL FIX: Split blob into 80-char lines
              if '\n' not in content and len(content) > 80:
                  lines = [content[i:i+80] for i in range(0, len(content), 80)]
                  print("Split source blob into 80-char lines")
              else:
                  lines = content.split('\n')

              new_lines = []
              for line in lines:
                  upper_line = line.upper()
                  
                  # Replace Z##### with actual User ID
                  line = line.replace("Z#####", USER)

                  # Fill the 5 Blanks
                  if "<< BLANK 1 >>" in line:
                      line = line.replace("<< BLANK 1 >>", "DISPLAY PANEL(DASHPNL)")
                  elif "BLANK 2" in upper_line:
                      line = "IF RC = 8 THEN LEAVE"
                  elif "<< BLANK 3 >>" in line:
                      line = line.replace("<< BLANK 3 >>", "LISTDSI")
                  elif "<< BLANK 4 >>" in line:
                      line = line.replace("<< BLANK 4 >>", "SYSDSORG")
                  elif "<< BLANK 5 >>" in line:
                      line = line.replace("<< BLANK 5 >>", "SYSRECFM")

                  new_lines.append(line)
                  
                  # Inject #CRE Logic (The Solo Mission)
                  # A. Initialization: Add after LIBDEF
                  if "LIBDEF" in upper_line:
                      new_lines.append("#CRE = 'UNKNOWN'")
                  
                  # B. Success Mapping: Add after SYSRECFM assignment
                  if "SYSRECFM" in line and "=" in line:
                      new_lines.append("#CRE = SYSCREATE")
                  
                  # C. Error Default: Add after ELSE DO
                  if "ELSE DO" in upper_line:
                      new_lines.append("#CRE = 'ERROR'")

              # Join lines back together
              final_content = '\n'.join(new_lines)
              
              # Write to the user's dataset
              datasets.write(f"{SOURCE_DS}(REXX3)", final_content)
              print("REXX3 script modified and saved successfully")
              
          except Exception as e:
              print(f"Error processing REXX3: {e}")

          print("=== STEP 4: Submit Validation ===")
          time.sleep(5)
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKREXX3)")
              print(f"Validation job submitted: {val_job.job_id}")
          except Exception as e:
              print(f"Validation submit error: {e}")
              
          print("=== REXX3 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no rexx3.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/rexx3.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/rexx3.py"
