name: COBOL Check Automation

on:
  workflow_dispatch:

jobs:
  mainframe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass
      
      - name: Find Java and Db2 Tools
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
          echo '--- CHECK JAVA ---'
          which java 2>/dev/null || echo 'java not found'
          
          echo '--- CHECK DB2 COMMAND PATHS ---'
          ls /usr/lpp/db2/bin 2>/dev/null
          ls /usr/lpp/db2c10/bin 2>/dev/null
          ls /usr/lpp/db2910_base/bin 2>/dev/null
          
          echo '--- CHECK JDBC DRIVER ---'
          find /usr/lpp -name 'db2jcc4.jar' 2>/dev/null
          
          echo '--- END ---'
          "
