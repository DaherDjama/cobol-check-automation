name: COBOL Check Automation

on:
  workflow_dispatch:

jobs:
  mainframe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass
      
      - name: Find Db2 Tools and Read JCL
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
          echo '--- CHECK DB2D10 BIN ---'
          ls /usr/lpp/db2d10/bin 2>/dev/null
          
          echo '--- FIND DSN COMMAND ---'
          find /usr/lpp/db2d10 -name DSN -type f 2>/dev/null
          
          echo '--- FIND JAVA ---'
          find /usr/lpp/java -name java -type f 2>/dev/null | head -3
          
          echo '--- READ CHKSQL JCL ---'
          cat \"//'ZXP.PUBLIC.JCL(CHKSQL)'\" 2>&1 | head -50
          
          echo '--- END ---'
          "
