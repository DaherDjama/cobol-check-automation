name: COBOL Check Automation

on:
  push:
    branches: [ main ]

jobs:
  cobol-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'temurin'
          
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
          cobc --version
          
      - name: Install Zowe CLI
        run: |
          npm install -g @zowe/cli@7.26.0
          zowe --version

      - name: 🔍 DIAGNOSTIC: Test Mainframe Connectivity
        run: |
          echo "========================================="
          echo "Testing connectivity to 204.90.115.200"
          echo "========================================="
          
          echo "1. Testing Port 443 (HTTPS / z/OSMF REST API)..."
          if timeout 10 bash -c 'cat < /dev/null > /dev/tcp/204.90.115.200/443' 2>/dev/null; then
            echo "✅ SUCCESS: Port 443 is OPEN and reachable from GitHub Actions."
          else
            echo "❌ FAILED: Port 443 is BLOCKED or unreachable (ECONNREFUSED)."
          fi
          
          echo ""
          echo "2. Testing Port 22 (SSH)..."
          if timeout 10 bash -c 'cat < /dev/null > /dev/tcp/204.90.115.200/22' 2>/dev/null; then
            echo "✅ SUCCESS: Port 22 is OPEN and reachable."
          else
            echo "❌ FAILED: Port 22 is also blocked."
          fi
          
          echo ""
          echo "3. Testing z/OSMF REST API via curl..."
          curl -v --connect-timeout 10 -k https://204.90.115.200:443/zosmf/info || echo "Curl failed - confirms port 443 block."
          
          echo "========================================="
          echo "Diagnostic complete."
          echo "========================================="

      - name: Setup Mainframe Environment and Upload COBOL Check
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
        run: |
          chmod +x .github/scripts/zowe_operations.sh
          .github/scripts/zowe_operations.sh
          
      - name: Run COBOL Check on Mainframe
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
        run: |
          chmod +x .github/scripts/mainframe_operations.sh
          .github/scripts/mainframe_operations.sh
