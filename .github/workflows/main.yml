name: COBOL Check Automation

on:
  workflow_dispatch:  # Allows manual trigger

jobs:
  mainframe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install SSH Pass (for SCP action)
        run: sudo apt-get install -y sshpass

      # STEP 1: UPLOAD FILES TO MAINFRAME
      - name: Upload COBOL Check and Source to Mainframe
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          # Upload the cobol-check folder, src folder, and any JCL files
          source: "cobol-check,src,*.JCL" 
          target: "/z/${{ secrets.SSH_USERNAME }}/cobolcheck"
          overwrite: true
          strip_components: 0

      # STEP 2: RUN COMMANDS ON MAINFRAME
      - name: Setup and Run on Mainframe
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "Connected successfully!"
            cd /z/${{ secrets.SSH_USERNAME }}/cobolcheck
            ls -la
            echo "Files uploaded. Ready to compile/run COBOL."
            # Add your compilation commands here later
