
name: COBOL Check Automation

on:
  workflow_dispatch:

jobs:
  mainframe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass
      
      - name: Create Directories
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "mkdir -p /z/${{ secrets.SSH_USERNAME }}/cobolcheck/main /z/${{ secrets.SSH_USERNAME }}/cobolcheck/test"
      
      - name: Upload Main COBOL Files
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no \
            ./src/main/cobol/DEPTPAY \
            ./src/main/cobol/EMPPAY \
            ./src/main/cobol/NUMBERS \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/${{ secrets.SSH_USERNAME }}/cobolcheck/main/
      
      - name: Upload Test COBOL Files
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no \
            ./src/test/cobol/DEPTPAY \
            ./src/test/cobol/EMPPAY \
            ./src/test/cobol/NUMBERS \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/${{ secrets.SSH_USERNAME }}/cobolcheck/test/
      
      - name: Verify Upload
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "ls -la /z/${{ secrets.SSH_USERNAME }}/cobolcheck/main /z/${{ secrets.SSH_USERNAME }}/cobolcheck/test"
