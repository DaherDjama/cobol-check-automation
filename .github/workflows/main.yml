name: COBOL Check Automation

on:
  workflow_dispatch:

jobs:
  mainframe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass
      
      - name: Deep Search for Db2 and Python
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
          echo '--- CHECK PYTHON ---'
          which python 2>/dev/null || echo 'python not found'
          
          echo '--- LIST INSTALLED PRODUCTS ---'
          ls /usr/lpp 2>/dev/null
          
          echo '--- READ PUBLIC JCL (ZOAU) ---'
          dcat 'ZXP.PUBLIC.JCL(CHKSQL)' 2>&1 | head -30
          
          echo '--- END ---'
          "
