name: COBOL Check Automation

on:
  workflow_dispatch:

jobs:
  mainframe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Upload Files to Mainframe
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "cobol-check,src,*.JCL"
          target: "/z/${{ secrets.SSH_USERNAME }}/cobolcheck"
          overwrite: true

      - name: Run Commands on Mainframe
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "Successfully connected!"
            cd /z/${{ secrets.SSH_USERNAME }}/cobolcheck
            ls -la
