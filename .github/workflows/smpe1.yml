name: SMPE1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  smpe1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > smpe1.py << 'PYEOF'
          import subprocess
          import time
          import re
          from zoautil_py import datasets, jobs

          def run_cmd(cmd):
              res = subprocess.run(cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          SRC = "ZXP.PUBLIC.JCL(GIMSAMPU)"
          DST = f"{USER}.JCL(GIMSAMPU)"
          JCL_DS = f"{USER}.JCL"

          print("=== STEP 1: Delete and Recreate Dataset ===")
          # Delete the entire dataset (not just the member)
          try:
              datasets.delete(JCL_DS)
              print("Deleted entire JCL dataset")
          except:
              print("Dataset didn't exist or delete failed")
          
          # Allocate with LRECL=120
          res = run_cmd(f'tso "ALLOCATE DSNAME(\'{JCL_DS}\') DSORG(PO) RECFM(F,B) LRECL(120) SPACE(1,1) TRACKS"')
          print(f"Allocate result: {res.strip()}")

          print("=== STEP 2: Read and Edit Source ===")
          try:
              content = datasets.read(SRC)
              print(f"Read {len(content)} chars")
              
              # Split into lines
              if '\n' in content:
                  lines = content.split('\n')
              else:
                  lines = [content[i:i+80] for i in range(0, len(content), 80)]
              print(f"Split into {len(lines)} lines")

              edited_lines = []
              for line in lines:
                  # 1. Symbolics
                  line = line.replace("&HLQ&", "&SYSUID..SMP")
                  line = line.replace("&VOLUME&", "VPWRKA")
                  line = line.replace("&UNIT&", "3390")

                  # 2. DEFZONES (IDCAMS): CYL/CYLINDERS -> TRACKS(2 1)
                  if 'CYLINDERS(' in line or 'CYL(' in line:
                      line = re.sub(r'CYLINDERS\(\d+\s+\d+\)', 'TRACKS(2 1)', line)
                      line = re.sub(r'CYL\(\d+\s+\d+\)', 'TRACKS(2 1)', line)
                  
                  # 3. ALLOCDS (JCL DD): SPACE=(CYL,...) -> SPACE=(TRK,(1,1)) or (1,1,1)
                  line = re.sub(r'SPACE=\(CYLINDERS,\(\d+,\d+\)\)', 'SPACE=(TRK,(1,1))', line)
                  line = re.sub(r'SPACE=\(CYL,\(\d+,\d+\)\)', 'SPACE=(TRK,(1,1))', line)
                  line = re.sub(r'SPACE=\(CYLINDERS,\(\d+,\d+,\d+\)\)', 'SPACE=(TRK,(1,1,1))', line)
                  line = re.sub(r'SPACE=\(CYL,\(\d+,\d+,\d+\)\)', 'SPACE=(TRK,(1,1,1))', line)

                  edited_lines.append(line)
                  
              final_content = "\n".join(edited_lines)
              datasets.write(DST, final_content)
              print("Write successful")
          except Exception as e:
              print(f"Error: {e}")

          print("=== STEP 3: Submit using zoautil_py.jobs ===")
          try:
              # Submit returns a Job object
              job = jobs.submit(DST)
              job_id = job.job_id  # Access job_id attribute directly
              print(f"Job submitted: {job_id}")
              
              print("Waiting 45 seconds for job to complete...")
              time.sleep(45)
              
              # Read job output
              print("--- Checking Job Output (JESMSGLG) ---")
              try:
                  output = jobs.read_output(job_id, "JESMSGLG")
                  print(output)
              except Exception as e:
                  print(f"Could not read output: {e}")
                  
          except Exception as e:
              print(f"Submit error: {e}")

          print("=== STEP 4: Submit Validation ===")
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKSMP1)")
              print(f"Validation job submitted: {val_job.job_id}")
          except Exception as e:
              print(f"Validation submit error: {e}")

          print("=== Done ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no smpe1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/smpe1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/smpe1.py"
