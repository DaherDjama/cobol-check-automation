
name: SMPE1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  smpe1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > smpe1.py << 'PYEOF'
          import subprocess
          import time
          import re
          from zoautil_py import datasets

          def run_tso(cmd):
              """Helper to run TSO commands"""
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          SRC = "ZXP.PUBLIC.JCL(GIMSAMPU)"
          DST = f"{USER}.JCL(GIMSAMPU)"

          print("=== STEP 1: Ensure JCL dataset exists (LRECL=120 for edited lines) ===")
          # Delete old dataset to start fresh
          run_tso(f"DELETE '{USER}.JCL'")
          # Allocate with LRECL=120. Original is 80, edits add a few chars.
          res = run_tso(f"ALLOCATE DSNAME('{USER}.JCL') DSORG(PO) RECFM(F,B) LRECL(120) SPACE(1,1) TRACKS")
          print(f"Allocate result: {res.strip()}")

          print("=== STEP 2: Copy source member ===")
          try:
              datasets.copy(SRC, DST)
              print("Copy successful")
          except Exception as e:
              print(f"Error copying: {e}")

          print("=== STEP 3: Read, Fix Line Lengths, and Modify ===")
          try:
              # Read the content
              content = datasets.read(DST)
              print(f"Raw content length: {len(content)}")
              
              # CRITICAL FIX: The source is likely FB/80. 
              # datasets.read might be returning a blob. Split every 80 chars to restore lines.
              lines = [content[i:i+80] for i in range(0, len(content), 80)]
              content = "\n".join(lines)
              print("Restored line breaks (split every 80 chars)")

              # 1. Symbolics
              content = content.replace("&HLQ&", "&SYSUID..SMP")
              content = content.replace("&VOLUME&", "VPWRKA")
              content = content.replace("&UNIT&", "3390")

              # 2. Space units (CYL -> TRK)
              content = content.replace("CYLINDERS", "TRACKS")
              content = content.replace("CYL", "TRK")

              # 3. Space allocations (Regex)
              # Clusters (2 numbers): SPACE=(TRK,(2,1))
              content = re.sub(r'SPACE=\(TRK,\(\d+,\d+\)\)', 'SPACE=(TRK,(2,1))', content)
              # PO datasets (3 numbers): SPACE=(TRK,(1,1,1))
              content = re.sub(r'SPACE=\(TRK,\(\d+,\d+,\d+\)\)', 'SPACE=(TRK,(1,1,1))', content)

              print("Edits applied successfully")

              # Write back
              datasets.write(DST, content)
              print("Modified JCL written successfully")
          except Exception as e:
              print(f"Error modifying JCL: {e}")

          print("=== STEP 4: Submit GIMSAMPU job ===")
          res = run_tso(f"submit '{DST}'")
          print(f"Submit result: {res.strip()}")

          print("=== STEP 5: Wait for job to finish ===")
          time.sleep(60)

          print("=== STEP 6: Submit Validation Job (CHKSMP1) ===")
          res = run_tso("submit 'ZXP.PUBLIC.JCL(CHKSMP1)'")
          print(res)
          
          print("=== SMPE1 Automation Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no smpe1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/smpe1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/smpe1.py"
