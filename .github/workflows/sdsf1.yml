name: SDSF1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  sdsf1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > sdsf1.py << 'PYEOF'
          import subprocess
          import time
          import re

          def run_tso(cmd):
              """Helper to run TSO commands"""
              # Ensure command is wrapped in tso "..."
              if not cmd.startswith('tso'):
                  full_cmd = f'tso "{cmd}"'
              else:
                  full_cmd = cmd
              
              res = subprocess.run(full_cmd, shell=True, capture_output=True, text=True)
              return res.stdout + res.stderr

          print("=== STEP 1: Ensure OUTPUT dataset exists ===")
          # Allocate the OUTPUT PDS if it doesn't exist. Ignore errors if it does.
          run_tso("ALLOCATE DSNAME('Z89674.OUTPUT') DSORG(PO) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")
          print("OUTPUT dataset ready.")

          print("=== STEP 2: Submit CHKTSO4 job ===")
          output = run_tso("submit 'ZXP.PUBLIC.JCL(CHKTSO4)'")
          print(output)

          print("=== STEP 3: Extract Job ID ===")
          match = re.search(r'(JOB\d+)', output)
          if not match:
              print("Failed to find Job ID in output.")
              exit(1)
          
          job_id = match.group(1)
          print(f"Captured Job ID: {job_id}")

          print("=== STEP 4: Wait for job to finish ===")
          time.sleep(30)

          print("=== STEP 5: Save output using OPRINT ===")
          # The challenge asks to save to OUTPUT(TSO4).
          # We try common DD names: SYSPRINT, SYSTSPRT, JESYSMSG
          dd_names = ['SYSPRINT', 'SYSTSPRT', 'JESYSMSG', 'JESJCL']
          success = False
          
          for dd in dd_names:
              print(f"Trying to save DD={dd}...")
              # OPRINT syntax: OPRINT JOB(jobid) DD(ddname) DSN('dataset(member)')
              cmd = f"OPRINT JOB({job_id}) DD({dd}) DSN('Z89674.OUTPUT(TSO4)')"
              res = run_tso(cmd)
              print(res)
              
              # Check for success (OPRINT usually returns RC 0 or specific messages)
              if "error" not in res.lower() and "failed" not in res.lower() and "not found" not in res.lower():
                  print(f"Success with DD={dd}!")
                  success = True
                  break
              else:
                  print(f"Failed with DD={dd}, trying next...")

          if not success:
              print("Warning: OPRINT might have failed for all DD names. Check logs.")
              
          print("=== SDSF1 Automation Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no sdsf1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/sdsf1.py

      - name: Execute automation script
        run: |
          # Source profile to ensure 'tso' and 'python3' are in PATH, then run script
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/sdsf1.py"
