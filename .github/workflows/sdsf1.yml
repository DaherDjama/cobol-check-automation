
name: SDSF1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  sdsf1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > sdsf1.py << 'PYEOF'
          import subprocess
          import time
          from zoautil_py import datasets, jobs

          def run_shell(cmd):
              # Run shell command (for ZOAU tools)
              full_cmd = f"source /etc/profile 2>/dev/null; {cmd}"
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          print("=== STEP 1: Ensure OUTPUT dataset exists ===")
          # Allocate the OUTPUT PDS if it doesn't exist
          run_shell("tso \"ALLOCATE DSNAME('Z89674.OUTPUT') DSORG(PO) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS\"")
          print("OUTPUT dataset ready.")

          print("=== STEP 2: Submit CHKTSO4 job ===")
          # Submit the job using TSO command
          submit_out = run_shell("tso \"submit 'ZXP.PUBLIC.JCL(CHKTSO4)'\"")
          print(f"Submit response: {submit_out}")

          print("=== STEP 3: Wait for job to finish ===")
          # Give the mainframe time to process the job
          time.sleep(30)

          print("=== STEP 4: Find the completed job using ZOAU ===")
          # Use ZOAU 'jobs' command to find our job. 
          # We look for jobs owned by our userid that have finished (RC != None)
          try:
              my_jobs = jobs.search(owner="*") # Search for all jobs owned by current user
              # Filter for the specific job name or just take the most recent completed one
              target_job = None
              
              # Sort by jobid descending to get the newest first
              sorted_jobs = sorted(my_jobs, key=lambda x: x.job_id, reverse=True)
              
              for j in sorted_jobs:
                  # Look for the job that was just submitted (CHKTSO4 usually has a specific name or we just take the latest)
                  # Since we can't easily filter by name via API without knowing exact prefix, 
                  # we'll assume the most recent completed job is ours.
                  if j.rc is not None: # Job has finished
                      target_job = j
                      break
                      
              if target_job:
                  job_id = target_job.job_id
                  print(f"Found completed job: {job_id} with RC={target_job.rc}")
              else:
                  print("No completed jobs found. Waiting longer...")
                  time.sleep(30)
                  # Try again
                  my_jobs = jobs.search(owner="*")
                  sorted_jobs = sorted(my_jobs, key=lambda x: x.job_id, reverse=True)
                  for j in sorted_jobs:
                      if j.rc is not None:
                          target_job = j
                          job_id = j.job_id
                          print(f"Found completed job after wait: {job_id}")
                          break
                  
          except Exception as e:
              print(f"Error searching jobs: {e}")
              exit(1)

          print("=== STEP 5: Save output using jcat and datasets.write ===")
          # Try common DD names to find the job log
          dd_names = ['SYSPRINT', 'SYSTSPRT', 'JESYSMSG', 'JESJCL']
          success = False
          
          for dd in dd_names:
              print(f"Trying to capture DD={dd}...")
              # Use jcat (ZOAU) to get spool content
              cmd = f"jcat -j {job_id} -d {dd}"
              content = run_shell(cmd)
              
              # Check if we got actual content
              if "JES000" not in content and "not found" not in content.lower() and len(content) > 10:
                  print(f"Success capturing {dd}! Writing to dataset...")
                  
                  # Format content for dataset (truncate lines to 80 chars)
                  lines = content.split('\n')
                  # Remove empty lines at end
                  while lines and not lines[-1].strip():
                      lines.pop()
                  
                  formatted_content = '\n'.join([l[:80] for l in lines])
                  
                  try:
                      datasets.write("Z89674.OUTPUT(TSO4)", formatted_content)
                      print(f"Successfully wrote to Z89674.OUTPUT(TSO4) using content from {dd}")
                      success = True
                      break
                  except Exception as e:
                      print(f"Error writing dataset: {e}")
              else:
                  print(f"DD={dd} not found or empty.")

          if not success:
              print("Warning: Could not capture output. Check Job ID and DD names.")
              
          print("=== SDSF1 Automation Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no sdsf1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/sdsf1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/sdsf1.py"
