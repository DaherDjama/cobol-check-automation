name: SDSF1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  sdsf1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create automation script locally
        run: |
          cat > run_sdsf1.sh << 'SHEOF'
          #!/bin/bash
          source /etc/profile 2>/dev/null || true

          echo "=== STEP 1: Ensure OUTPUT dataset exists ==="
          # Create the OUTPUT PDS if it doesn't exist (required for SHR disposition)
          tso "ALLOCATE DSNAME('Z89674.OUTPUT') DSORG(PO) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS" 2>/dev/null || echo "OUTPUT dataset ready"

          echo "=== STEP 2: Submit CHKTSO4 job ==="
          SUBMIT_OUT=$(submit 'ZXP.PUBLIC.JCL(CHKTSO4)' 2>&1)
          echo "$SUBMIT_OUT"
          
          # Extract the Job ID (e.g., JOB00123) from the submit output
          JOBID=$(echo "$SUBMIT_OUT" | grep -o 'JOB[0-9]*' | head -1)
          echo "Captured Job ID: $JOBID"

          if [ -z "$JOBID" ]; then
              echo "Failed to capture Job ID. Exiting."
              exit 1
          fi

          echo "=== STEP 3: Wait for job to finish ==="
          sleep 45

          echo "=== STEP 4: Save output using OPRINT (equivalent to SDSF XDC) ==="
          # OPRINT copies the spool output to a dataset, just like SDSF XDC
          # Syntax: OPRINT JOB(jobid) DD(ddname) DSN('dataset(member)') SHR
          OPRINT_OUT=$(tso "OPRINT JOB($JOBID) DD(SYSPRINT) DSN('Z89674.OUTPUT(TSO4)') SHR" 2>&1)
          echo "$OPRINT_OUT"

          echo "=== STEP 5: Verify dataset member ==="
          tso "LISTDS 'Z89674.OUTPUT(TSO4)'" 2>&1 || echo "Member check failed"

          echo "=== SDSF1 Challenge Automation Complete ==="
          SHEOF
          chmod +x run_sdsf1.sh

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no run_sdsf1.sh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/run_sdsf1.sh

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "bash /z/z89674/run_sdsf1.sh"
