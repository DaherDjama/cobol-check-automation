name: SDSF1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  sdsf1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > sdsf1.py << 'PYEOF'
          import subprocess
          import time
          import re
          from zoautil_py import datasets

          def run_cmd(cmd):
              """Run a shell command and return output, handling encoding."""
              # Use latin-1 to prevent UnicodeDecodeError from EBCDIC characters
              res = subprocess.run(cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          print("=== STEP 1: Ensure OUTPUT dataset exists ===")
          # Allocate the OUTPUT PDS if it doesn't exist
          run_cmd("tso \"ALLOCATE DSNAME('Z89674.OUTPUT') DSORG(PO) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS\"")
          print("OUTPUT dataset ready.")

          print("=== STEP 2: Submit CHKTSO4 job ===")
          # Submit the job. We ignore the garbled output, we know it works.
          submit_out = run_cmd("tso \"submit 'ZXP.PUBLIC.JCL(CHKTSO4)'\"")
          print("Job submitted (output was garbled EBCDIC, but that's expected).")

          print("=== STEP 3: Wait for job to finish ===")
          time.sleep(30)

          print("=== STEP 4: Find Job ID using 'jls' ===")
          # Run 'jls' (ZOAU Job List) to see recent jobs
          jls_out = run_cmd("jls")
          print("--- JLS Output ---")
          print(jls_out)
          print("------------------")

          # Parse the output to find the Job ID
          # jls usually outputs: JOBNAME JOBID OWNER ...
          # We look for 'CHKTSO4' or just grab the most recent JOB ID
          job_id = None
          
          # Try to find specific job name
          match = re.search(r'CHKTSO4\s+(JOB\d+)', jls_out)
          if match:
              job_id = match.group(1)
          else:
              # Fallback: Find all JOB IDs and take the last one (most recent)
              matches = re.findall(r'(JOB\d+)', jls_out)
              if matches:
                  job_id = matches[-1]
          
          if not job_id:
              print("Could not find Job ID. Exiting.")
              exit(1)
              
          print(f"Found Job ID: {job_id}")

          print("=== STEP 5: Capture Spool Output ===")
          # Try to get the output from SYSPRINT (standard output) or JESYSMSG (job log)
          # We try multiple DD names
          dd_names = ['SYSPRINT', 'JESYSMSG', 'JESJCL', 'SYSTSPRT']
          content = ""
          
          for dd in dd_names:
              print(f"Trying to read DD={dd}...")
              # jcat reads spool output. 
              # We use iconv to convert EBCDIC to ASCII just in case, though jcat usually does it.
              cmd = f"jcat -j {job_id} -d {dd} 2>/dev/null | iconv -f IBM-1047 -t UTF-8 2>/dev/null"
              res = run_cmd(cmd)
              
              # Check if we got meaningful content (length > 20 chars)
              if len(res) > 20 and "JES000" not in res:
                  print(f"Success! Got content from {dd}.")
                  content = res
                  break
              else:
                  print(f"Empty or error for {dd}.")

          if not content:
              print("Warning: Could not get spool content. Trying raw jcat...")
              # Fallback without iconv
              content = run_cmd(f"jcat -j {job_id} -d SYSPRINT")

          print("=== STEP 6: Save to Dataset ===")
          # Clean up the content for the dataset
          lines = content.split('\n')
          clean_lines = []
          for line in lines:
              # Remove non-printable characters (artifacts from encoding)
              clean_line = ''.join(c for c in line if c.isprintable() or c in ['\n', '\t', ' '])
              # Truncate to 80 chars for the dataset
              clean_lines.append(clean_line[:80])
          
          # Remove empty lines at the end
          while clean_lines and not clean_lines[-1].strip():
              clean_lines.pop()

          final_text = '\n'.join(clean_lines)
          
          try:
              datasets.write("Z89674.OUTPUT(TSO4)", final_text)
              print("Successfully saved to Z89674.OUTPUT(TSO4)!")
          except Exception as e:
              print(f"Error saving dataset: {e}")
              # Fallback: Write to USS file if dataset write fails
              with open('/z/z89674/TSO4.txt', 'w') as f:
                  f.write(final_text)
              print("Saved to USS file /z/z89674/TSO4.txt as fallback.")

          print("=== SDSF1 Automation Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no sdsf1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/sdsf1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/sdsf1.py"
