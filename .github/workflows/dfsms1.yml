name: DFSMS1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  dfsms1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script for DFSMS1
        run: |
          cat > dfsms1.py << 'PYEOF'
          import subprocess
          import time
          from zoautil_py import datasets, jobs

          def run_tso(cmd):
              full_cmd = 'tso "' + cmd + '"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          NONSMS_DS = USER + ".NONSMS.FILE1"
          TOOBIG_DS = USER + ".TOOBIG"

          print("=== STEP 1: Cleanup Old Datasets ===")
          try:
              datasets.delete(NONSMS_DS)
          except:
              pass
          try:
              datasets.delete(TOOBIG_DS)
          except:
              pass
          time.sleep(2)

          print("=== STEP 2: Allocate NONSMS Dataset via JCL ===")
          # Create JCL to allocate NONSMS dataset
          # STORCLAS= (blank) forces non-SMS allocation
          # Try different ZXP* volumes
          volumes = ['ZXP000', 'ZXP001', 'ZXP002', 'ZXP003', 'ZXP004', 'ZXP005',
                     'ZXP006', 'ZXP007', 'ZXP008', 'ZXP009', 'ZXP010',
                     'ZXP0011', 'ZXP0012', 'ZXP0013', 'ZXP0014', 'ZXP0015',
                     'ZXP0100', 'ZXP0200', 'ZXP0300', 'ZXP0400', 'ZXP0500',
                     'ZXP1000', 'ZXP2000', 'ZXP9000', 'ZXP999', 'ZXP00A', 'ZXP00B']
          
          success = False
          for vol in volumes:
              print("Trying volume " + vol + "...")
              
              # Create JCL member
              jcl_content = "//NONSMS JOB (ACCT),'NONSMS',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID\n"
              jcl_content += "//STEP1 EXEC PGM=IEFBR14\n"
              jcl_content += "//DD1 DD DSN=" + NONSMS_DS + ",\n"
              jcl_content += "// DISP=(NEW,CATLG,DELETE),\n"
              jcl_content += "// UNIT=SYSDA,\n"
              jcl_content += "// SPACE=(TRK,(5,1)),\n"
              jcl_content += "// RECFM=FB,LRECL=20,DSORG=PS,\n"
              jcl_content += "// STORCLAS=,\n"
              jcl_content += "// VOL=SER=" + vol + "\n"
              jcl_content += "//\n"
              
              try:
                  # Write JCL to a member
                  member_name = "NS" + vol[-3:] if len(vol) >= 3 else "NS" + vol
                  datasets.write(USER + ".JCL(" + member_name + ")", jcl_content)
                  
                  # Submit the job
                  job = jobs.submit(USER + ".JCL(" + member_name + ")")
                  print("Submitted job: " + job.job_id)
                  
                  # Wait for job to complete
                  time.sleep(10)
                  
                  # Check if dataset was created
                  ds_list = datasets.list_datasets(NONSMS_DS)
                  if ds_list:
                      print("SUCCESS with volume " + vol + "!")
                      success = True
                      break
                  else:
                      print("Failed on " + vol)
              except Exception as e:
                  print("Error with " + vol + ": " + str(e))
              time.sleep(2)

          if not success:
              print("WARNING: NONSMS dataset not created via JCL. Trying TSO ALLOCATE without volume...")
              # Try TSO ALLOCATE without specifying volume (let ACS handle it)
              cmd = "ALLOCATE DSNAME('" + NONSMS_DS + "') NEW SPACE(5,1) TRKS RECFM(F,B) LRECL(20) DSORG(PS)"
              res = run_tso(cmd)
              print("TSO Result: " + res.strip()[:200])
              ds_list = datasets.list_datasets(NONSMS_DS)
              if ds_list:
                  success = True
                  print("Success without volume!")

          print("=== STEP 3: Allocate TOOBIG Dataset ===")
          cmd_toobig = "ALLOCATE DSNAME('" + TOOBIG_DS + "') NEW SPACE(100,1) TRKS RECFM(F,B) LRECL(20) DSORG(PO)"
          res_toobig = run_tso(cmd_toobig)
          print("TOOBIG Result: " + res_toobig.strip()[:100])

          if 'RC(12)' in res_toobig or 'RC(012)' in res_toobig:
              print("TOOBIG failed, trying smaller space...")
              run_tso("ALLOCATE DSNAME('" + TOOBIG_DS + "') NEW SPACE(10,1) TRKS RECFM(F,B) LRECL(80) DSORG(PO)")

          print("=== STEP 4: Create MESSAGE Member ===")
          message_words = "OVERRIDDEN BY ACS"
          try:
              datasets.write(TOOBIG_DS + "(MESSAGE)", message_words)
              print("Created member MESSAGE with content: " + message_words)
          except Exception as e:
              print("Error creating member: " + str(e))

          print("=== STEP 5: Submit Validation Job ===")
          time.sleep(3)
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKSMS1)")
              print("Validation job submitted: " + val_job.job_id)
          except Exception as e:
              print("Validation submit error: " + str(e))

          print("=== DFSMS1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no dfsms1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/dfsms1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/dfsms1.py"
