
name: DFSMS1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  dfsms1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script for DFSMS1
        run: |
          cat > dfsms1.py << 'PYEOF'
          import subprocess
          import time
          import textwrap
          from zoautil_py import datasets, jobs

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          NONSMS_DS = f"NONSMS.{USER}"
          TOOBIG_DS = f"{USER}.TOOBIG"
          JCL_DS = f"{USER}.JCL"

          print("=== STEP 0: Ensure JCL PDS Exists ===")
          # Check if Z89674.JCL exists, if not create it
          ds_list = datasets.list_datasets(JCL_DS)
          if not ds_list:
              print("Creating JCL PDS...")
              run_tso(f"ALLOCATE DSNAME('{JCL_DS}') DSORG(PO) RECFM(F,B) LRECL(80) SPACE(10,1) TRKS")
          else:
              print("JCL PDS already exists.")

          print("=== STEP 1: Cleanup Old Datasets ===")
          try: datasets.delete(NONSMS_DS)
          except: pass
          try: datasets.delete(TOOBIG_DS)
          except: pass
          time.sleep(2)

          print("=== STEP 2: Find Non-SMS Volume via JCL ===")
          # Try common non-SMS volumes. 
          # CRITICAL: Use STORCLAS= (blank) for non-SMS allocation in JCL.
          volumes_to_try = ['ZXP000', 'ZXP001', 'ZXP002', 'ZXP003', 'ZXP004', 'ZXP005', 
                            'ZXP006', 'ZXP007', 'ZXP008', 'ZXP009', 'ZXP010']
          
          success = False
          for vol in volumes_to_try:
              print(f"\n--- Trying volume {vol} ---")
              
              # FIX: Member name must be <= 8 chars. 'NS' + last 3 chars of volume (e.g., NS001)
              member_name = f"NS{vol[-3:]}" 
              
              # JCL with STORCLAS= (blank) to force non-SMS
              nonsms_jcl = textwrap.dedent(f"""
                  //NONSMS   JOB (ACCT),'NONSMS',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID
                  //STEP1    EXEC PGM=IEFBR14
                  //DD1      DD DSN={NONSMS_DS},
                  //            DISP=(NEW,CATLG,DELETE),
                  //            UNIT=SYSDA,
                  //            SPACE=(TRK,(5,1)),
                  //            RECFM=FB,LRECL=20,DSORG=PS,
                  //            STORCLAS=,
                  //            VOL=SER={vol}
                  //
              """)
              
              try:
                  # Write JCL member
                  datasets.write(f"{JCL_DS}({member_name})", nonsms_jcl)
                  print(f"Wrote JCL to member {member_name}")
                  
                  # Submit job
                  job = jobs.submit(f"{JCL_DS}({member_name})")
                  job_id = job.job_id
                  print(f"Submitted job {job_id} for volume {vol}")
                  
                  # Wait for job to complete
                  time.sleep(15)
                  
                  # Check if dataset exists
                  ds_list_check = datasets.list_datasets(NONSMS_DS)
                  if ds_list_check:
                      print(f"SUCCESS with volume {vol}! Dataset created.")
                      success = True
                      break
                  else:
                      print(f"Failed on {vol}. Dataset not created.")
              except Exception as e:
                  print(f"Error with {vol}: {e}")
              time.sleep(3)

          if not success:
              print("\nWARNING: Could not find non-SMS volume with STORCLAS=. Trying without STORCLAS parameter...")
              # Fallback: Try without STORCLAS parameter at all (let ACS handle it based on name NONSMS.*)
              for vol in ['ZXP000', 'ZXP001', 'ZXP002']:
                  print(f"Trying {vol} without STORCLAS...")
                  member_name = f"NS2{vol[-3:]}"
                  nonsms_jcl2 = textwrap.dedent(f"""
                      //NONSMS   JOB (ACCT),'NONSMS',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID
                      //STEP1    EXEC PGM=IEFBR14
                      //DD1      DD DSN={NONSMS_DS},
                      //            DISP=(NEW,CATLG,DELETE),
                      //            UNIT=SYSDA,
                      //            SPACE=(TRK,(5,1)),
                      //            RECFM=FB,LRECL=20,DSORG=PS,
                      //            VOL=SER={vol}
                      //
                  """)
                  try:
                      datasets.write(f"{JCL_DS}({member_name})", nonsms_jcl2)
                      job = jobs.submit(f"{JCL_DS}({member_name})")
                      time.sleep(10)
                      ds_list_check = datasets.list_datasets(NONSMS_DS)
                      if ds_list_check:
                          print(f"SUCCESS with {vol} (no STORCLAS)!")
                          success = True
                          break
                  except Exception as e:
                      print(f"Error: {e}")

          print("\n=== STEP 3: Allocate TOOBIG Dataset ===")
          toobig_jcl = textwrap.dedent(f"""
              //TOOBIG   JOB (ACCT),'TOOBIG',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID
              //STEP1    EXEC PGM=IEFBR14
              //DD1      DD DSN={TOOBIG_DS},
              //            DISP=(NEW,CATLG,DELETE),
              //            UNIT=SYSDA,
              //            SPACE=(TRK,(100,1)),
              //            RECFM=FB,LRECL=20,DSORG=PO
              //
          """)
          try:
              datasets.write(f"{JCL_DS}(TOOBIG)", toobig_jcl)
              job = jobs.submit(f"{JCL_DS}(TOOBIG)")
              print(f"TOOBIG job submitted: {job.job_id}")
              time.sleep(10)
          except Exception as e:
              print(f"TOOBIG error: {e}")

          print("=== STEP 4: Create MESSAGE Member ===")
          message_words = "OVERRIDDEN BY ACS"
          try:
              datasets.write(f"{TOOBIG_DS}(MESSAGE)", message_words)
              print(f"Created member MESSAGE with content: {message_words}")
          except Exception as e:
              print(f"Error creating member: {e}")

          print("=== STEP 5: Submit Validation Job ===")
          time.sleep(5)
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKSMS1)")
              print(f"Validation job submitted: {val_job.job_id}")
          except Exception as e:
              print(f"Validation submit error: {e}")

          print("=== DFSMS1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no dfsms1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/dfsms1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/dfsms1.py"
