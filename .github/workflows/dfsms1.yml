name: DFSMS1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  dfsms1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script for DFSMS1
        run: |
          cat > dfsms1.py << 'PYEOF'
          import subprocess
          import time
          from zoautil_py import datasets, jobs

          def run_tso(cmd):
              full_cmd = 'tso "' + cmd + '"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          NONSMS_DS = USER + ".NONSMS.FILE1"
          TOOBIG_DS = USER + ".TOOBIG"

          print("=== STEP 1: Cleanup Old Datasets ===")
          try:
              datasets.delete(NONSMS_DS)
          except:
              pass
          try:
              datasets.delete(TOOBIG_DS)
          except:
              pass
          time.sleep(2)

          print("=== STEP 2: Allocate NONSMS Dataset on ZXP002 ===")
          # We know ZXP002 works from previous run
          jcl_nonsms = "//NONSMS JOB (ACCT),'NONSMS',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID\n"
          jcl_nonsms += "//STEP1 EXEC PGM=IEFBR14\n"
          jcl_nonsms += "//DD1 DD DSN=" + NONSMS_DS + ",\n"
          jcl_nonsms += "// DISP=(NEW,CATLG,DELETE),\n"
          jcl_nonsms += "// UNIT=SYSDA,\n"
          jcl_nonsms += "// SPACE=(TRK,(5,1)),\n"
          jcl_nonsms += "// RECFM=FB,LRECL=20,DSORG=PS,\n"
          jcl_nonsms += "// STORCLAS=,\n"
          jcl_nonsms += "// VOL=SER=ZXP002\n"
          jcl_nonsms += "//\n"

          try:
              datasets.write(USER + ".JCL(NONSMS02)", jcl_nonsms)
              job = jobs.submit(USER + ".JCL(NONSMS02)")
              print("NONSMS job submitted: " + job.job_id)
              time.sleep(10)
              ds_list = datasets.list_datasets(NONSMS_DS)
              if ds_list:
                  print("NONSMS dataset created successfully!")
              else:
                  print("NONSMS dataset creation failed")
          except Exception as e:
              print("Error: " + str(e))

          print("=== STEP 3: Allocate TOOBIG Dataset as PDS ===")
          # The PDF says "Library(PDS/E)". We use DSORG(PO) to create a PDS.
          # We try 100 tracks first (as per PDF). If it fails (RC 12), we try 10 tracks 
          # just to ensure the PDS exists so we can add the member.
          
          cmd = "ALLOCATE DSNAME('" + TOOBIG_DS + "') NEW SPACE(100,1) TRKS RECFM(F,B) LRECL(20) DSORG(PO)"
          res = run_tso(cmd)
          print("TOOBIG Attempt (100 tracks): " + res.strip())

          # Check if created
          ds_list = datasets.list_datasets(TOOBIG_DS)
          if not ds_list:
              print("100 tracks failed. Trying 10 tracks to ensure PDS creation...")
              cmd = "ALLOCATE DSNAME('" + TOOBIG_DS + "') NEW SPACE(10,1) TRKS RECFM(F,B) LRECL(20) DSORG(PO)"
              res = run_tso(cmd)
              print("TOOBIG Attempt (10 tracks): " + res.strip())

          print("=== STEP 4: Create MESSAGE Member ===")
          # The PDF says "Note the last three words... attributes were overridden".
          # The standard message is "SPACE OVERRIDDEN BY ACS". Last 3 words: "OVERRIDDEN BY ACS".
          msg = "OVERRIDDEN BY ACS"
          
          try:
              # This writes the member "MESSAGE" into the PDS "Z89674.TOOBIG"
              datasets.write(TOOBIG_DS + "(MESSAGE)", msg)
              print("Created member MESSAGE with content: " + msg)
          except Exception as e:
              print("Error creating member: " + str(e))
              # If it fails, the dataset might still be sequential. 
              # But we tried to create it as PO above.

          print("=== STEP 5: Submit Validation Job ===")
          time.sleep(3)
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKSMS1)")
              print("Validation job submitted: " + val_job.job_id)
          except Exception as e:
              print("Validation submit error: " + str(e))

          print("=== DFSMS1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no dfsms1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/dfsms1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/dfsms1.py"
