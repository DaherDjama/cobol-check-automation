name: DFSMS1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  dfsms1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script for DFSMS1
        run: |
          cat > dfsms1.py << 'PYEOF'
          import subprocess
          import time
          import textwrap
          from zoautil_py import datasets, jobs

          USER = "Z89674"
          NONSMS_DS = f"NONSMS.{USER}"
          TOOBIG_DS = f"{USER}.TOOBIG"

          print("=== STEP 1: Cleanup Old Datasets ===")
          try: datasets.delete(NONSMS_DS)
          except: pass
          try: datasets.delete(TOOBIG_DS)
          except: pass
          time.sleep(2)

          print("=== STEP 2: Allocate NONSMS Dataset via JCL ===")
          # Try JCL with STORCLAS='' (empty string) - this is the correct JCL syntax
          # Try multiple volumes
          volumes = ['ZXP001', 'ZXP002', 'ZXP003', 'ZXP004', 'ZXP005',
                     'ZXP006', 'ZXP007', 'ZXP008', 'ZXP009', 'ZXP010']
          
          success = False
          for vol in volumes:
              print(f"Trying volume {vol}...")
              nonsms_jcl = textwrap.dedent(f"""
                  //NONSMS   JOB (ACCT),'NONSMS ALLOC',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID
                  //STEP1    EXEC PGM=IEFBR14
                  //DD1      DD DSN={NONSMS_DS},
                  //            DISP=(NEW,CATLG,DELETE),
                  //            UNIT=SYSDA,
                  //            SPACE=(TRK,(5,1)),
                  //            RECFM=FB,LRECL=20,DSORG=PS,
                  //            STORCLAS='',
                  //            VOL=SER={vol}
                  //
              """)
              
              try:
                  datasets.write(f"{USER}.JCL(NONSM{vol[-3:]})", nonsms_jcl)
                  job = jobs.submit(f"{USER}.JCL(NONSM{vol[-3:]})")
                  print(f"Submitted job for {vol}: {job.job_id}")
                  time.sleep(10)
                  
                  # Check if dataset exists
                  ds_list = datasets.list_datasets(NONSMS_DS)
                  if ds_list:
                      print(f"SUCCESS with volume {vol}!")
                      success = True
                      break
                  else:
                      print(f"Failed on {vol}")
              except Exception as e:
                  print(f"Error with {vol}: {e}")
              time.sleep(2)

          if not success:
              print("All specific volumes failed. Trying without volume...")
              nonsms_jcl_novol = textwrap.dedent(f"""
                  //NONSMS   JOB (ACCT),'NONSMS ALLOC',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID
                  //STEP1    EXEC PGM=IEFBR14
                  //DD1      DD DSN={NONSMS_DS},
                  //            DISP=(NEW,CATLG,DELETE),
                  //            UNIT=SYSDA,
                  //            SPACE=(TRK,(5,1)),
                  //            RECFM=FB,LRECL=20,DSORG=PS,
                  //            STORCLAS=''
                  //
              """)
              try:
                  datasets.write(f"{USER}.JCL(NONSMSNV)", nonsms_jcl_novol)
                  job = jobs.submit(f"{USER}.JCL(NONSMSNV)")
                  print(f"Submitted job without volume: {job.job_id}")
                  time.sleep(10)
                  ds_list = datasets.list_datasets(NONSMS_DS)
                  if ds_list:
                      success = True
                      print("Success without specific volume!")
              except Exception as e:
                  print(f"Error without volume: {e}")

          if not success:
              print("WARNING: NONSMS dataset not created. Trying TSO ALLOCATE with STORCLAS('')...")
              # Last resort: try TSO with STORCLAS('') - single quotes with nothing inside
              for vol in ['ZXP001', 'ZXP002', 'ZXP003']:
                  cmd = f"ALLOCATE DSNAME('{NONSMS_DS}') NEW SPACE(5,1) TRKS RECFM(F,B) LRECL(20) DSORG(PS) STORCLAS('') VOLUME({vol})"
                  res = subprocess.run(f'tso "{cmd}"', shell=True, capture_output=True, encoding='latin-1', errors='replace')
                  print(f"TSO attempt {vol}: {res.stdout.strip()[:100]}")
                  ds_list = datasets.list_datasets(NONSMS_DS)
                  if ds_list:
                      success = True
                      print(f"TSO SUCCESS with {vol}!")
                      break
                  time.sleep(2)

          print("=== STEP 3: Allocate TOOBIG Dataset ===")
          toobig_jcl = textwrap.dedent(f"""
              //TOOBIG   JOB (ACCT),'TOOBIG ALLOC',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID
              //STEP1    EXEC PGM=IEFBR14
              //DD1      DD DSN={TOOBIG_DS},
              //            DISP=(NEW,CATLG,DELETE),
              //            UNIT=SYSDA,
              //            SPACE=(TRK,(100,1)),
              //            RECFM=FB,LRECL=20,DSORG=PO
              //
          """)
          try:
              datasets.write(f"{USER}.JCL(TOOBIG)", toobig_jcl)
              job = jobs.submit(f"{USER}.JCL(TOOBIG)")
              print(f"TOOBIG job submitted: {job.job_id}")
              time.sleep(10)
          except Exception as e:
              print(f"TOOBIG error: {e}")

          print("=== STEP 4: Create MESSAGE Member ===")
          message_words = "OVERRIDDEN BY ACS"
          try:
              datasets.write(f"{TOOBIG_DS}(MESSAGE)", message_words)
              print(f"Created member MESSAGE with content: {message_words}")
          except Exception as e:
              print(f"Error creating member: {e}")

          print("=== STEP 5: Submit Validation Job ===")
          time.sleep(5)
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKSMS1)")
              print(f"Validation job submitted: {val_job.job_id}")
          except Exception as e:
              print(f"Validation submit error: {e}")

          print("=== DFSMS1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no dfsms1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/dfsms1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/dfsms1.py"
