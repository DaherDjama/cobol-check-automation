name: DFSMS1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  dfsms1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script for DFSMS1
        run: |
          cat > dfsms1.py << 'PYEOF'
          import subprocess
          import time
          from zoautil_py import datasets, jobs

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          NONSMS_DS = f"{USER}.DFSMS1"
          TOOBIG_DS = f"{USER}.TOOBIG"

          print("=== STEP 1: Find Non-SMS Volume ===")
          # Try common Z Xplore non-SMS volumes
          volumes = ['ZXP001', 'ZXP002', 'ZXP003', 'ZXP004', 'ZXP005', 'ZXP006', 'ZXP007', 'ZXP008', 'ZXP009', 'ZXP010']
          target_vol = None
          
          for vol in volumes:
              # Try to allocate a test dataset to see if volume is valid and non-SMS
              # We use STORCLAS() to try and force non-SMS, but primarily rely on the volume
              res = run_tso(f"ALLOCATE DSNAME('{USER}.TESTVOL') NEW SPACE(1,1) TRKS VOLUME({vol}) STORCLAS(' ')")
              if 'IKJ56233I' in res or 'ALLOCATED' in res.upper() or 'NORMAL END' in res.upper():
                  # Check if it actually worked by listing it
                  res2 = run_tso(f"LISTDS '{USER}.TESTVOL'")
                  if 'NOT FOUND' not in res2 and 'IKJ56233I' not in res2:
                      target_vol = vol
                      print(f"Found working volume: {vol}")
                      # Delete test dataset
                      run_tso(f"DELETE '{USER}.TESTVOL'")
                      break
              time.sleep(1)

          if not target_vol:
              print("Could not find a valid non-SMS volume. Defaulting to ZXP001")
              target_vol = 'ZXP001'

          print("=== STEP 2: Allocate Non-SMS Dataset ===")
          # Delete if exists
          try: datasets.delete(NONSMS_DS)
          except: pass
          
          # Attributes: TRKS, Primary 5, Secondary 1, FB, LRECL 20, PS
          # STORCLAS(' ') forces blank storage class (non-SMS)
          res = run_tso(f"ALLOCATE DSNAME('{NONSMS_DS}') NEW SPACE(5,1) TRKS RECFM(F,B) LRECL(20) DSORG(PS) VOLUME({target_vol}) STORCLAS(' ')")
          print(f"Non-SMS Allocate Result: {res.strip()}")

          print("=== STEP 3: Allocate SMS Dataset (TOOBIG) ===")
          # Delete if exists
          try: datasets.delete(TOOBIG_DS)
          except: pass
          
          # Attributes: TRKS, Primary 100, FB, LRECL 20, PO (Library)
          # No volume specified, let SMS handle it
          res = run_tso(f"ALLOCATE DSNAME('{TOOBIG_DS}') NEW SPACE(100,1) TRKS RECFM(F,B) LRECL(20) DSORG(PO)")
          print(f"TOOBIG Allocate Result: {res.strip()}")

          print("=== STEP 4: Extract Message and Create MEMBER ===")
          # The message is usually "SPACE OVERRIDDEN BY ACS" or similar.
          # We look for keywords like "OVERRIDE" or "ACS" in the output
          output_upper = res.upper()
          message_words = "OVERRIDDEN BY ACS" # Default guess
          
          if 'OVERRIDDEN' in output_upper:
              # Find the line with OVERRIDDEN and take last 3 words
              for line in res.split('\n'):
                  if 'OVERRIDDEN' in line.upper():
                      words = line.strip().split()
                      if len(words) >= 3:
                          message_words = ' '.join(words[-3:])
                          break
          elif 'ACS' in output_upper:
              message_words = "OVERRIDDEN BY ACS"
              
          print(f"Extracted Message: '{message_words}'")

          # Create the MESSAGE member
          try:
              datasets.write(f"{TOOBIG_DS}(MESSAGE)", message_words)
              print(f"Created member MESSAGE with content: {message_words}")
          except Exception as e:
              print(f"Error creating member: {e}")
              # If PO failed, try creating it as PS first then we can't add member, but validator needs PO.
              # Let's try to allocate as PO explicitly if it failed
              res2 = run_tso(f"ALLOCATE DSNAME('{TOOBIG_DS}') NEW SPACE(10,1) TRKS RECFM(F,B) LRECL(80) DSORG(PO)")
              try:
                  datasets.write(f"{TOOBIG_DS}(MESSAGE)", message_words)
              except: pass

          print("=== STEP 5: Submit Validation Job ===")
          time.sleep(5)
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKSMS1)")
              print(f"Validation job submitted: {val_job.job_id}")
          except Exception as e:
              print(f"Validation submit error: {e}")

          print("=== DFSMS1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no dfsms1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/dfsms1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/dfsms1.py"
