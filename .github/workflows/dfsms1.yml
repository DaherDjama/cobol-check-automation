name: DFSMS1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  dfsms1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script for DFSMS1
        run: |
          cat > dfsms1.py << 'PYEOF'
          import subprocess
          import time
          from zoautil_py import datasets, jobs

          def run_tso(cmd):
              full_cmd = 'tso "' + cmd + '"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          NONSMS_DS = USER + ".NONSMS.FILE1"
          TOOBIG_DS = USER + ".TOOBIG"

          print("=== STEP 1: Cleanup Old Datasets ===")
          try: datasets.delete(NONSMS_DS)
          except: pass
          try: datasets.delete(TOOBIG_DS)
          except: pass
          time.sleep(2)

          print("=== STEP 2: Allocate NONSMS Dataset on ZXP002 ===")
          jcl_nonsms = "//NONSMS JOB (ACCT),'NONSMS',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID\n"
          jcl_nonsms += "//STEP1 EXEC PGM=IEFBR14\n"
          jcl_nonsms += "//DD1 DD DSN=" + NONSMS_DS + ",\n"
          jcl_nonsms += "// DISP=(NEW,CATLG,DELETE),\n"
          jcl_nonsms += "// UNIT=SYSDA,\n"
          jcl_nonsms += "// SPACE=(TRK,(5,1)),\n"
          jcl_nonsms += "// RECFM=FB,LRECL=20,DSORG=PS,\n"
          jcl_nonsms += "// STORCLAS=,\n"
          jcl_nonsms += "// VOL=SER=ZXP002\n"
          jcl_nonsms += "//\n"

          try:
              datasets.write(USER + ".JCL(NONSMS02)", jcl_nonsms)
              job = jobs.submit(USER + ".JCL(NONSMS02)")
              print("NONSMS job submitted: " + job.job_id)
              time.sleep(10)
          except Exception as e:
              print("Error: " + str(e))

          print("=== STEP 3: Allocate TOOBIG Dataset via JCL (100 tracks, PDS/E) ===")
          # Use JCL with DSNTYPE=LIBRARY for PDS/E.
          # ACS will override the space (100 tracks) to a smaller limit.
          jcl_toobig = "//TOOBIG JOB (ACCT),'TOOBIG',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID\n"
          jcl_toobig += "//STEP1 EXEC PGM=IEFBR14\n"
          jcl_toobig += "//DD1 DD DSN=" + TOOBIG_DS + ",\n"
          jcl_toobig += "// DISP=(NEW,CATLG,DELETE),\n"
          jcl_toobig += "// UNIT=SYSDA,\n"
          jcl_toobig += "// SPACE=(TRK,(100,1)),\n"
          jcl_toobig += "// RECFM=FB,LRECL=20,\n"
          jcl_toobig += "// DSNTYPE=LIBRARY\n"
          jcl_toobig += "//\n"

          message_words = "OVERRIDDEN BY ACS" # Default fallback
          
          try:
              datasets.write(USER + ".JCL(TOOBIG1)", jcl_toobig)
              job = jobs.submit(USER + ".JCL(TOOBIG1)")
              job_id = job.job_id
              print("TOOBIG job submitted: " + job_id)
              time.sleep(15)

              # Read job output to find the ACS override message
              print("Reading job output...")
              # jobs.read_output returns a list of strings (lines) or list of dicts depending on version
              output = jobs.read_output(job_id)
              
              found_msg = False
              if isinstance(output, list):
                  for item in output:
                      # Handle both list of strings and list of dicts
                      line_content = ""
                      if isinstance(item, dict):
                          line_content = item.get('content', '')
                      else:
                          line_content = str(item)
                      
                      # Look for the override message
                      if 'OVERRIDDEN' in line_content.upper():
                          print("Found message line: " + line_content)
                          words = line_content.strip().split()
                          if len(words) >= 3:
                              message_words = ' '.join(words[-3:])
                              found_msg = True
                              break
              
              if not found_msg:
                  print("Could not find OVERRIDDEN in output. Using default: " + message_words)

          except Exception as e:
              print("Error reading job output: " + str(e))

          # Verify TOOBIG exists. If JCL failed (RC 12), create it with smaller space so we can add the member.
          ds_list = datasets.list_datasets(TOOBIG_DS)
          if not ds_list:
              print("TOOBIG not created via JCL. Creating with 10 tracks via TSO...")
              run_tso("ALLOCATE DSNAME('" + TOOBIG_DS + "') NEW SPACE(10,1) TRKS RECFM(F,B) LRECL(20) DSORG(PO)")
              ds_list = datasets.list_datasets(TOOBIG_DS)
              if ds_list:
                  print("TOOBIG created via TSO fallback.")

          print("=== STEP 4: Create MESSAGE Member ===")
          print("Using message: " + message_words)
          try:
              datasets.write(TOOBIG_DS + "(MESSAGE)", message_words)
              print("Created member MESSAGE with content: " + message_words)
          except Exception as e:
              print("Error creating member: " + str(e))

          print("=== STEP 5: Submit Validation Job ===")
          time.sleep(3)
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKSMS1)")
              print("Validation job submitted: " + val_job.job_id)
          except Exception as e:
              print("Validation submit error: " + str(e))

          print("=== DFSMS1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no dfsms1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/dfsms1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/dfsms1.py"
