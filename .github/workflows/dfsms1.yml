name: DFSMS1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  dfsms1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script for DFSMS1
        run: |
          cat > dfsms1.py << 'PYEOF'
          import subprocess
          import time
          import textwrap
          from zoautil_py import datasets, jobs

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          NONSMS_DS = f"NONSMS.{USER}"
          TOOBIG_DS = f"{USER}.TOOBIG"

          print("=== STEP 1: Cleanup Old Datasets ===")
          run_tso(f"DELETE '{NONSMS_DS}'")
          run_tso(f"DELETE '{TOOBIG_DS}'")
          time.sleep(2)

          print("=== STEP 2: Allocate NONSMS Dataset via JCL ===")
          # Use textwrap.dedent to allow indentation in YAML while keeping JCL at column 1
          nonsms_jcl = textwrap.dedent(f"""
              //NONSMS   JOB (ACCT),'NONSMS ALLOC',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID
              //STEP1    EXEC PGM=IEFBR14
              //DD1      DD DSN={NONSMS_DS},
              //            DISP=(NEW,CATLG,DELETE),
              //            UNIT=SYSDA,
              //            SPACE=(TRK,(5,1)),
              //            RECFM=FB,LRECL=20,DSORG=PS,
              //            STORCLAS=,
              //            VOL=SER=ZXP001
              //
          """)

          try:
              datasets.write(f"{USER}.JCL(NONSMS)", nonsms_jcl)
              print("Created NONSMS JCL member")
          except:
              run_tso(f"ALLOCATE DSNAME('{USER}.JCL') DSORG(PO) RECFM(F,B) LRECL(80) SPACE(1,1) TRKS")
              datasets.write(f"{USER}.JCL(NONSMS)", nonsms_jcl)

          try:
              job = jobs.submit(f"{USER}.JCL(NONSMS)")
              print(f"NONSMS allocation job submitted: {job.job_id}")
              time.sleep(10)
          except Exception as e:
              print(f"NONSMS submit error: {e}")

          print("=== STEP 3: Allocate TOOBIG Dataset via JCL ===")
          toobig_jcl = textwrap.dedent(f"""
              //TOOBIG   JOB (ACCT),'TOOBIG ALLOC',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID
              //STEP1    EXEC PGM=IEFBR14
              //DD1      DD DSN={TOOBIG_DS},
              //            DISP=(NEW,CATLG,DELETE),
              //            UNIT=SYSDA,
              //            SPACE=(TRK,(100,1)),
              //            RECFM=FB,LRECL=20,
              //            DSNTYPE=LIBRARY
              //
          """)

          try:
              datasets.write(f"{USER}.JCL(TOOBIG)", toobig_jcl)
              print("Created TOOBIG JCL member")
          except:
              datasets.write(f"{USER}.JCL(TOOBIG)", toobig_jcl)

          try:
              job = jobs.submit(f"{USER}.JCL(TOOBIG)")
              print(f"TOOBIG allocation job submitted: {job.job_id}")
              time.sleep(10)
          except Exception as e:
              print(f"TOOBIG submit error: {e}")

          print("=== STEP 4: Verify Datasets Exist ===")
          res1 = run_tso(f"LISTDS '{NONSMS_DS}'")
          print(f"NONSMS check: {res1.strip()[:100]}")

          res2 = run_tso(f"LISTDS '{TOOBIG_DS}'")
          print(f"TOOBIG check: {res2.strip()[:100]}")

          print("=== STEP 5: Create MESSAGE Member in TOOBIG ===")
          message_words = "OVERRIDDEN BY ACS"

          if 'NOT FOUND' in res2 or 'IKJ56233I' in res2:
              print("TOOBIG not found, creating as standard PDS...")
              run_tso(f"ALLOCATE DSNAME('{TOOBIG_DS}') NEW SPACE(10,1) TRKS RECFM(F,B) LRECL(80) DSORG(PO)")

          try:
              datasets.write(f"{TOOBIG_DS}(MESSAGE)", message_words)
              print(f"Created member MESSAGE with content: {message_words}")
          except Exception as e:
              print(f"Error creating member: {e}")

          print("=== STEP 6: Submit Validation Job ===")
          time.sleep(5)
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKSMS1)")
              print(f"Validation job submitted: {val_job.job_id}")
          except Exception as e:
              print(f"Validation submit error: {e}")

          print("=== DFSMS1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no dfsms1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/dfsms1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/dfsms1.py"
