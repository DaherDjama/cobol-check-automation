name: DFSMS1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  dfsms1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script for DFSMS1
        run: |
          cat > dfsms1.py << 'PYEOF'
          import subprocess
          import time
          from zoautil_py import datasets, jobs

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          NONSMS_DS = f"NONSMS.{USER}"
          TOOBIG_DS = f"{USER}.TOOBIG"

          print("=== STEP 1: Cleanup Old Datasets ===")
          run_tso(f"DELETE '{NONSMS_DS}'")
          run_tso(f"DELETE '{TOOBIG_DS}'")
          time.sleep(2)

          print("=== STEP 2: Allocate Non-SMS Dataset (NONSMS.Z89674) ===")
          # Try multiple volumes and use STORCLAS(' ') (space) for blank storage class
          volumes = ['ZXP001', 'ZXP002', 'ZXP003', 'ZXP004', 'ZXP005']
          success_non_sms = False
          
          for vol in volumes:
              print(f"Trying volume {vol}...")
              # Use STORCLAS(' ') with a space inside for blank storage class
              cmd = f"ALLOCATE DSNAME('{NONSMS_DS}') NEW SPACE(5,1) TRKS RECFM(F,B) LRECL(20) DSORG(PS) VOLUME({vol}) STORCLAS(' ')"
              res = run_tso(cmd)
              print(f"Result for {vol}: {res.strip()}")
              if 'IKJ56233I' in res or 'NORMAL END' in res.upper() or 'ALLOCATED' in res.upper():
                  # Verify it exists
                  res2 = run_tso(f"LISTDS '{NONSMS_DS}'")
                  if 'NOT FOUND' not in res2 and 'IKJ56233I' not in res2:
                      print(f"SUCCESS with volume {vol}!")
                      success_non_sms = True
                      break
              time.sleep(1)

          if not success_non_sms:
              print("WARNING: Could not allocate NONSMS dataset with specific volumes. Trying without volume...")
              # If ACS routine handles NONSMS.* naming, maybe it assigns volume?
              cmd = f"ALLOCATE DSNAME('{NONSMS_DS}') NEW SPACE(5,1) TRKS RECFM(F,B) LRECL(20) DSORG(PS) STORCLAS(' ')"
              res = run_tso(cmd)
              print(f"Result without volume: {res.strip()}")

          print("=== STEP 3: Allocate SMS Dataset (TOOBIG) as PDS/E ===")
          # Use DSNTYPE(LIBRARY) for PDS/E. Do NOT use DSORG(PO) as it conflicts.
          cmd_toobig = f"ALLOCATE DSNAME('{TOOBIG_DS}') NEW SPACE(100,1) TRKS RECFM(F,B) LRECL(20) DSNTYPE(LIBRARY)"
          res_toobig = run_tso(cmd_toobig)
          print(f"TOOBIG Allocate Result: {res_toobig.strip()}")

          print("=== STEP 4: Extract Message and Create MEMBER ===")
          message_words = "OVERRIDDEN BY ACS"
          
          # Parse output for the message
          if 'OVERRIDDEN' in res_toobig.upper():
              for line in res_toobig.split('\n'):
                  if 'OVERRIDDEN' in line.upper():
                      words = line.strip().split()
                      if len(words) >= 3:
                          message_words = ' '.join(words[-3:])
                          break
                          
          print(f"Using Message: '{message_words}'")

          # Ensure TOOBIG exists (fallback if PDS/E failed)
          if 'RC(12)' in res_toobig or 'RC(012)' in res_toobig:
              print("PDS/E allocation failed. Trying standard PO allocation as fallback...")
              run_tso(f"ALLOCATE DSNAME('{TOOBIG_DS}') NEW SPACE(10,1) TRKS RECFM(F,B) LRECL(80) DSORG(PO)")
              
          try:
              datasets.write(f"{TOOBIG_DS}(MESSAGE)", message_words)
              print(f"Created member MESSAGE with content: {message_words}")
          except Exception as e:
              print(f"Error creating member: {e}")

          print("=== STEP 5: Submit Validation Job ===")
          time.sleep(5)
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKSMS1)")
              print(f"Validation job submitted: {val_job.job_id}")
          except Exception as e:
              print(f"Validation submit error: {e}")

          print("=== DFSMS1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no dfsms1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/dfsms1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/dfsms1.py"
