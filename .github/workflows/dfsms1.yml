name: DFSMS1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  dfsms1-spy:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Spy Script
        run: |
          cat > spy.py << 'PYEOF'
          import subprocess
          from zoautil_py import datasets

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          print("=== PHASE 1: Find ACS Source Code ===")
          # List all datasets starting with ZXP.PUBLIC
          ds_list = datasets.list_datasets("ZXP.PUBLIC.*")
          print(f"Found datasets: {ds_list}")

          # Look for the source code (members with $)
          for ds in ds_list:
              print(f"\nChecking {ds}...")
              try:
                  # Try to list members
                  members = datasets.list_members(ds)
                  print(f"Members: {members}")
                  
                  # Read members that contain $
                  for m in members:
                      if '$' in m:
                          print(f"\n--- READING MEMBER {m} ---")
                          content = datasets.read(f"{ds}({m})")
                          print(content)
                          print(f"--- END MEMBER {m} ---")
              except Exception as e:
                  print(f"Error accessing {ds}: {e}")

          print("\n=== PHASE 2: Try Allocation with Discovered Info ===")
          # Based on PDF, the name is likely NONSMS.Z89674
          # We will try to allocate it. 
          # The PDF says "a blank storage class('') results in non-SMS".
          # If the ACS routine is set up for NONSMS.*, it should handle it.
          
          USER = "Z89674"
          NONSMS_DS = f"NONSMS.{USER}"
          
          # Cleanup
          try: datasets.delete(NONSMS_DS)
          except: pass

          # Try allocating without volume first (let ACS handle it completely)
          print("Trying allocation without volume (ACS should handle NONSMS.*)...")
          cmd = f"ALLOCATE DSNAME('{NONSMS_DS}') NEW SPACE(5,1) TRKS RECFM(F,B) LRECL(20) DSORG(PS)"
          res = run_tso(cmd)
          print(f"Result: {res.strip()[:200]}")
          
          ds_check = datasets.list_datasets(NONSMS_DS)
          if ds_check:
              print("SUCCESS! Dataset created without specific volume.")
          else:
              print("Failed without volume. The ACS source code above should tell us the correct volume.")

          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no spy.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/spy.py

      - name: Execute Spy Script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/spy.py"
