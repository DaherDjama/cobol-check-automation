
name: DFSMS1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  dfsms1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script for DFSMS1
        run: |
          cat > dfsms1.py << 'PYEOF'
          import subprocess
          import time
          import textwrap
          from zoautil_py import datasets, jobs

          USER = "Z89674"
          NONSMS_DS = f"NONSMS.{USER}"
          TOOBIG_DS = f"{USER}.TOOBIG"

          print("=== STEP 1: Cleanup Old Datasets ===")
          try: datasets.delete(NONSMS_DS)
          except: pass
          try: datasets.delete(TOOBIG_DS)
          except: pass
          time.sleep(2)

          print("=== STEP 2: Allocate NONSMS Dataset via JCL ===")
          # Use JCL with IEFBR14 to allocate NONSMS dataset
          # Try without specifying volume - let ACS handle it based on naming pattern
          nonsms_jcl = textwrap.dedent(f"""
              //NONSMS   JOB (ACCT),'NONSMS ALLOC',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID
              //STEP1    EXEC PGM=IEFBR14
              //DD1      DD DSN={NONSMS_DS},
              //            DISP=(NEW,CATLG,DELETE),
              //            UNIT=SYSDA,
              //            SPACE=(TRK,(5,1)),
              //            RECFM=FB,LRECL=20,DSORG=PS
              //
          """)

          try:
              datasets.write(f"{USER}.JCL(NONSMS)", nonsms_jcl)
              print("Created NONSMS JCL member")
              job = jobs.submit(f"{USER}.JCL(NONSMS)")
              print(f"NONSMS allocation job submitted: {job.job_id}")
              time.sleep(15)
          except Exception as e:
              print(f"NONSMS error: {e}")

          # Verify NONSMS exists
          ds_list = datasets.list_datasets(f"NONSMS.{USER}")
          if ds_list:
              print("SUCCESS: NONSMS dataset exists!")
          else:
              print("WARNING: NONSMS dataset not found, trying with volume ZXP001...")
              # Try with explicit volume
              nonsms_jcl_vol = textwrap.dedent(f"""
                  //NONSMS   JOB (ACCT),'NONSMS ALLOC',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID
                  //STEP1    EXEC PGM=IEFBR14
                  //DD1      DD DSN={NONSMS_DS},
                  //            DISP=(NEW,CATLG,DELETE),
                  //            UNIT=SYSDA,
                  //            SPACE=(TRK,(5,1)),
                  //            RECFM=FB,LRECL=20,DSORG=PS,
                  //            VOL=SER=ZXP001
                  //
              """)
              try:
                  datasets.write(f"{USER}.JCL(NONSMS2)", nonsms_jcl_vol)
                  job = jobs.submit(f"{USER}.JCL(NONSMS2)")
                  print(f"NONSMS with volume job submitted: {job.job_id}")
                  time.sleep(15)
              except Exception as e:
                  print(f"NONSMS with volume error: {e}")

          print("=== STEP 3: Allocate TOOBIG Dataset via JCL ===")
          toobig_jcl = textwrap.dedent(f"""
              //TOOBIG   JOB (ACCT),'TOOBIG ALLOC',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID
              //STEP1    EXEC PGM=IEFBR14
              //DD1      DD DSN={TOOBIG_DS},
              //            DISP=(NEW,CATLG,DELETE),
              //            UNIT=SYSDA,
              //            SPACE=(TRK,(100,1)),
              //            RECFM=FB,LRECL=20,DSORG=PO
              //
          """)

          try:
              datasets.write(f"{USER}.JCL(TOOBIG)", toobig_jcl)
              print("Created TOOBIG JCL member")
              job = jobs.submit(f"{USER}.JCL(TOOBIG)")
              print(f"TOOBIG allocation job submitted: {job.job_id}")
              time.sleep(15)
          except Exception as e:
              print(f"TOOBIG error: {e}")

          print("=== STEP 4: Create MESSAGE Member ===")
          message_words = "OVERRIDDEN BY ACS"
          try:
              datasets.write(f"{TOOBIG_DS}(MESSAGE)", message_words)
              print(f"Created member MESSAGE with content: {message_words}")
          except Exception as e:
              print(f"Error creating member: {e}")
              # Fallback: create TOOBIG as simple PDS
              toobig_simple = textwrap.dedent(f"""
                  //TOOBIG2  JOB (ACCT),'TOOBIG SIMPLE',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID
                  //STEP1    EXEC PGM=IEFBR14
                  //DD1      DD DSN={TOOBIG_DS},
                  //            DISP=(NEW,CATLG,DELETE),
                  //            UNIT=SYSDA,
                  //            SPACE=(TRK,(10,1)),
                  //            RECFM=FB,LRECL=80,DSORG=PO
                  //
              """)
              try:
                  datasets.write(f"{USER}.JCL(TOOBIG2)", toobig_simple)
                  job = jobs.submit(f"{USER}.JCL(TOOBIG2)")
                  print(f"TOOBIG simple job submitted: {job.job_id}")
                  time.sleep(10)
                  datasets.write(f"{TOOBIG_DS}(MESSAGE)", message_words)
                  print(f"Created member MESSAGE (fallback)")
              except Exception as e2:
                  print(f"Fallback also failed: {e2}")

          print("=== STEP 5: Submit Validation Job ===")
          time.sleep(5)
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKSMS1)")
              print(f"Validation job submitted: {val_job.job_id}")
          except Exception as e:
              print(f"Validation submit error: {e}")

          print("=== DFSMS1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no dfsms1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/dfsms1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/dfsms1.py"
