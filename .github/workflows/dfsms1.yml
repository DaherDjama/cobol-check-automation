
name: DFSMS1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  dfsms1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script for DFSMS1
        run: |
          cat > dfsms1.py << 'PYEOF'
          import subprocess
          import time
          from zoautil_py import datasets, jobs

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          NONSMS_DS = f"NONSMS.{USER}"
          TOOBIG_DS = f"{USER}.TOOBIG"

          print("=== STEP 1: Cleanup Old Datasets ===")
          try: datasets.delete(NONSMS_DS)
          except: pass
          try: datasets.delete(TOOBIG_DS)
          except: pass
          time.sleep(2)

          print("=== STEP 2: Find Non-SMS Volume and Allocate NONSMS Dataset ===")
          # Try a wider range of volumes
          volumes = ['ZXP001', 'ZXP002', 'ZXP003', 'ZXP004', 'ZXP005', 
                     'ZXP006', 'ZXP007', 'ZXP008', 'ZXP009', 'ZXP010',
                     'ZXP01', 'ZXP02', 'ZXP03', 'ZXP04', 'ZXP05']
          
          success = False
          for vol in volumes:
              print(f"Trying volume {vol}...")
              # For non-SMS: no STORCLAS, no DATACLAS, no MGMTCLAS
              # Use UNIT=3390 instead of SYSDA for non-SMS
              cmd = f"ALLOCATE DSNAME('{NONSMS_DS}') NEW SPACE(5,1) TRKS RECFM(F,B) LRECL(20) DSORG(PS) UNIT(3390) VOLUME({vol})"
              res = run_tso(cmd)
              
              # Check if dataset exists
              ds_list = datasets.list_datasets(NONSMS_DS)
              if ds_list:
                  print(f"SUCCESS with volume {vol}!")
                  success = True
                  break
              else:
                  print(f"Failed on {vol}")
              time.sleep(1)

          if not success:
              print("All specific volumes failed. Trying without volume (name pattern only)...")
              # Try without volume - ACS routine should handle it based on NONSMS.* pattern
              cmd = f"ALLOCATE DSNAME('{NONSMS_DS}') NEW SPACE(5,1) TRKS RECFM(F,B) LRECL(20) DSORG(PS) UNIT(3390)"
              res = run_tso(cmd)
              print(f"Result: {res.strip()[:100]}")
              ds_list = datasets.list_datasets(NONSMS_DS)
              if ds_list:
                  success = True
                  print("Success without specific volume!")

          if not success:
              print("WARNING: NONSMS dataset not created. Validator will fail.")

          print("=== STEP 3: Allocate TOOBIG Dataset ===")
          # SMS-managed, no volume specified
          cmd_toobig = f"ALLOCATE DSNAME('{TOOBIG_DS}') NEW SPACE(100,1) TRKS RECFM(F,B) LRECL(20) DSORG(PO)"
          res_toobig = run_tso(cmd_toobig)
          print(f"TOOBIG Result: {res_toobig.strip()[:100]}")

          # Fallback if failed
          if 'RC(12)' in res_toobig or 'RC(012)' in res_toobig:
              print("TOOBIG failed, trying smaller space...")
              run_tso(f"ALLOCATE DSNAME('{TOOBIG_DS}') NEW SPACE(10,1) TRKS RECFM(F,B) LRECL(80) DSORG(PO)")

          print("=== STEP 4: Create MESSAGE Member ===")
          message_words = "OVERRIDDEN BY ACS"
          try:
              datasets.write(f"{TOOBIG_DS}(MESSAGE)", message_words)
              print(f"Created member MESSAGE with content: {message_words}")
          except Exception as e:
              print(f"Error creating member: {e}")

          print("=== STEP 5: Submit Validation Job ===")
          time.sleep(5)
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKSMS1)")
              print(f"Validation job submitted: {val_job.job_id}")
          except Exception as e:
              print(f"Validation submit error: {e}")

          print("=== DFSMS1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no dfsms1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/dfsms1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/dfsms1.py"
