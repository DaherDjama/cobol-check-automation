name: DFSMS1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  dfsms1-spy:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Spy Script
        run: |
          cat > spy.py << 'PYEOF'
          from zoautil_py import datasets

          print("=== PHASE 1: Read ACS Source Code ===")
          source_ds = "ZXP.PUBLIC.SOURCE"
          
          try:
              print(f"Listing members of {source_ds}...")
              # list_members expects a string, not a Dataset object
              members = datasets.list_members(source_ds)
              print(f"Members found: {members}")
              
              # Look for members with '$' in the name (as per PDF hint)
              for m in members:
                  if '$' in m:
                      print(f"\n{'='*60}")
                      print(f"READING MEMBER: {m}")
                      print(f"{'='*60}")
                      # Read the content of the member
                      content = datasets.read(f"{source_ds}({m})")
                      print(content)
                      print(f"{'='*60}")
                      print(f"END OF MEMBER: {m}")
                      print(f"{'='*60}\n")
          except Exception as e:
              print(f"Error reading source: {e}")
              import traceback
              traceback.print_exc()

          print("\n=== PHASE 2: Try Allocation ===")
          USER = "Z89674"
          NONSMS_DS = f"NONSMS.{USER}"
          
          # Cleanup old dataset
          try: 
              datasets.delete(NONSMS_DS)
              print(f"Deleted old {NONSMS_DS}")
          except: 
              pass

          # Try allocation without volume (let ACS handle it)
          print("Trying allocation without volume...")
          import subprocess
          def run_tso(cmd):
              res = subprocess.run(f'tso "{cmd}"', shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          cmd = f"ALLOCATE DSNAME('{NONSMS_DS}') NEW SPACE(5,1) TRKS RECFM(F,B) LRECL(20) DSORG(PS)"
          res = run_tso(cmd)
          print(f"TSO Result: {res.strip()}")
          
          ds_check = datasets.list_datasets(NONSMS_DS)
          if ds_check:
              print("SUCCESS! Dataset created without specific volume.")
          else:
              print("Failed. Check the source code above for the correct volume name.")

          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no spy.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/spy.py

      - name: Execute Spy Script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/spy.py"
