name: REXX2 Challenge Automation

on:
  workflow_dispatch:

jobs:
  rexx2-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > rexx2.py << 'PYEOF'
          import subprocess
          import time
          from zoautil_py import datasets

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          SOURCE_DS = f"{USER}.SOURCE"

          print("=== STEP 1: Delete and Recreate SOURCE Dataset (LRECL=120) ===")
          try:
              datasets.delete(SOURCE_DS)
              print("Deleted old SOURCE dataset")
          except:
              print("Dataset didn't exist")
          
          res = run_tso(f"ALLOCATE DSNAME('{SOURCE_DS}') DSORG(PO) RECFM(F,B) LRECL(120) SPACE(1,1) TRACKS")
          print(f"Allocate result: {res.strip()}")

          print("=== STEP 2: Create Blueprint (BLUPRNT) ===")
          blueprint_content = "PGMID: HELLOWLD | AUTHOR: Z89674 | MSG: GREETINGS FROM REXX"
          try:
              datasets.write(f"{SOURCE_DS}(BLUPRNT)", blueprint_content)
              print("Blueprint created")
          except Exception as e:
              print(f"Error creating blueprint: {e}")

          print("=== STEP 3: Write REXX2 Script ===")
          # Define the REXX script line by line to avoid indentation issues
          rexx_lines = [
              "/* REXX - REXX2 Code Generator */",
              "USERID = STRIP(SYSVAR('SYSUID'))", 
              "BP_DS = USERID || '.SOURCE(BLUPRNT)'",
              "",
              "SAY 'Checking for blueprint at: ' BP_DS",
              "",
              "IF SYSDSN(BP_DS) \\= 'OK' THEN DO",
              "    SAY 'Blueprint not found'",
              "    EXIT 1",
              "END",
              "",
              "/* Allocate and Read Blueprint */",
              "ADDRESS TSO",
              "\"ALLOCATE DA('\"BP_DS\"') F(INDD) SHR\"",
              "\"EXECIO * DISKR INDD (STEM BP. FINIS)\"",
              "\"FREE F(INDD)\"",
              "",
              "/* Parse Blueprint */",
              "PARSE VAR BP.1 'PGMID:' PGMID '| AUTHOR:' AUTHOR '| MSG:' MSG",
              "PGMID = STRIP(PGMID)",
              "AUTHOR = STRIP(AUTHOR)",
              "MSG = STRIP(MSG)",
              "",
              "SAY 'Generating COBOL for ' PGMID",
              "",
              "/* Build COBOL Code */",
              "COBOL.1 = '       IDENTIFICATION DIVISION.'",
              "COBOL.2 = '       PROGRAM-ID. ' PGMID '.'",
              "COBOL.3 = '       AUTHOR. ' AUTHOR '.'",
              "COBOL.4 = '       PROCEDURE DIVISION.'",
              "COBOL.5 = '       MAIN-PARA.'",
              "COBOL.6 = '           DISPLAY ''' MSG '''.'",
              "COBOL.7 = '           STOP RUN.'",
              "COBOL.0 = 7",
              "",
              "/* Write COBOL to Dataset */",
              "COBOL_DS = USERID || '.SOURCE(' PGMID ')'",
              "\"ALLOCATE DA('\"COBOL_DS\"') F(OUTDD) SHR REUSE\"",
              "IF RC \\= 0 THEN DO",
              "    \"ALLOCATE DA('\"COBOL_DS\"') F(OUTDD) NEW REUSE LRECL(80) RECFM(F,B) SPACE(1,1) TRACKS\"",
              "END",
              "\"EXECIO * DISKW OUTDD (STEM COBOL. FINIS)\"",
              "\"FREE F(OUTDD)\"",
              "SAY 'COBOL written to ' COBOL_DS",
              "",
              "/* Generate JCL for Compilation */",
              "JCL.1 = '//' PGMID 'C JOB (ACCT),''COMPILE'',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID'",
              "JCL.2 = '//STEP1 EXEC IGYWC'",
              "JCL.3 = '//COBOL.SYSIN DD DSN=' USERID '.SOURCE(' PGMID '),DISP=SHR'",
              "JCL.4 = '/*'",
              "JCL.0 = 4",
              "",
              "/* Write JCL and Submit */",
              "JCL_DS = USERID || '.SOURCE(' PGMID 'J)'",
              "\"ALLOCATE DA('\"JCL_DS\"') F(JCLDD) SHR REUSE\"",
              "IF RC \\= 0 THEN \"ALLOCATE DA('\"JCL_DS\"') F(JCLDD) NEW REUSE LRECL(80) RECFM(F,B) SPACE(1,1) TRACKS\"",
              "\"EXECIO * DISKW JCLDD (STEM JCL. FINIS)\"",
              "\"FREE F(JCLDD)\"",
              "",
              "SAY 'Submitting compile job...'",
              "\"SUBMIT '\" JCL_DS \"'\"",
              "SAY 'Done!'"
          ]
          
          final_script = '\n'.join(rexx_lines)

          try:
              datasets.write(f"{SOURCE_DS}(REXX2)", final_script)
              print("REXX2 script written successfully")
          except Exception as e:
              print(f"Error writing REXX2: {e}")

          print("=== STEP 4: Execute REXX Script ===")
          res = run_tso(f"exec '{SOURCE_DS}(REXX2)'")
          print(f"Exec result: {res.strip()}")

          print("=== STEP 5: Wait for Compile Job ===")
          time.sleep(30)

          print("=== STEP 6: Submit Validation ===")
          res = run_tso("submit 'ZXP.PUBLIC.JCL(CHKREXX2)'")
          print(f"Validation: {res.strip()}")
          
          print("=== REXX2 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no rexx2.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/rexx2.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/rexx2.py"
