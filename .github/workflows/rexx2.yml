
name: REXX2 Challenge Automation

on:
  workflow_dispatch:

jobs:
  rexx2-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > rexx2.py << 'PYEOF'
          import subprocess
          import time
          from zoautil_py import datasets, jobs

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          SOURCE_DS = f"{USER}.SOURCE"

          print("=== STEP 1: Prepare SOURCE Dataset (LRECL=80) ===")
          try:
              datasets.delete(SOURCE_DS)
              print("Deleted old SOURCE")
          except:
              pass
          
          res = run_tso(f"ALLOCATE DSNAME('{SOURCE_DS}') DSORG(PO) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")
          print(f"Allocate: {res.strip()}")

          print("=== STEP 2: Create Blueprint ===")
          bp = "PGMID: HELLOWLD | AUTHOR: Z89674 | MSG: GREETINGS FROM REXX"
          datasets.write(f"{SOURCE_DS}(BLUPRNT)", bp)
          print("Blueprint created")

          print("=== STEP 3: Write REXX Script ===")
          # Fixed member names to be <= 8 chars
          rexx_lines = [
              "/* REXX2 CODE GENERATOR */",
              "USERID = STRIP(SYSVAR('SYSUID'))",
              "BP_DS = USERID || '.SOURCE(BLUPRNT)'",
              "ADDRESS TSO",
              "\"ALLOCATE DA('\"BP_DS\"') F(INDD) SHR\"",
              "\"EXECIO * DISKR INDD (STEM BP. FINIS)\"",
              "\"FREE F(INDD)\"",
              "PARSE VAR BP.1 'PGMID:' PGMID '| AUTHOR:',",
              "  AUTHOR '| MSG:' MSG",
              "PGMID = STRIP(PGMID)",
              "AUTHOR = STRIP(AUTHOR)",
              "MSG = STRIP(MSG)",
              "SAY 'PGMID IS: ' PGMID",
              "COBOL.1 = '       IDENTIFICATION DIVISION.'",
              "COBOL.2 = '       PROGRAM-ID. ' PGMID '.'",
              "COBOL.3 = '       AUTHOR. ' AUTHOR '.'",
              "COBOL.4 = '       PROCEDURE DIVISION.'",
              "COBOL.5 = '       MAIN-PARA.'",
              "COBOL.6 = \"           DISPLAY '\" MSG \"'.\"",
              "COBOL.7 = '           STOP RUN.'",
              "COBOL.0 = 7",
              "COBOL_DS = USERID || '.SOURCE(' PGMID ')'",
              "\"ALLOCATE DA('\"COBOL_DS\"') F(OUTDD) SHR REUSE\"",
              "IF RC \\= 0 THEN \"ALLOCATE DA('\"COBOL_DS\"') F(OUTDD) NEW REUSE\"",
              "\"EXECIO * DISKW OUTDD (STEM COBOL. FINIS)\"",
              "\"FREE F(OUTDD)\"",
              "SAY 'COBOL WRITTEN'",
              "JCL.1 = '//COMPILE JOB (ACCT),COMPILE,CLASS=A'",
              "JCL.2 = '//STEP1 EXEC IGYWC'",
              "JCL.3 = '//COBOL.SYSIN DD DSN=' USERID '.SOURCE(' PGMID ')'",
              "JCL.3 = JCL.3 ',DISP=SHR'",
              "JCL.4 = '/*'",
              "JCL.0 = 4",
              "JCL_DS = USERID || '.SOURCE(COMPILEJ)'",
              "\"ALLOCATE DA('\"JCL_DS\"') F(JCLDD) SHR REUSE\"",
              "IF RC \\= 0 THEN \"ALLOCATE DA('\"JCL_DS\"') F(JCLDD) NEW REUSE\"",
              "\"EXECIO * DISKW JCLDD (STEM JCL. FINIS)\"",
              "\"FREE F(JCLDD)\"",
              "SAY 'JCL WRITTEN TO COMPILEJ'"
          ]
          
          datasets.write(f"{SOURCE_DS}(REXX2)", '\n'.join(rexx_lines))
          print("REXX script written")

          print("=== STEP 4: Run REXX Script ===")
          res = run_tso(f"exec '{SOURCE_DS}(REXX2)'")
          print(f"Exec finished.")

          print("=== STEP 5: Submit Generated JCL (Python fallback) ===")
          time.sleep(5)
          try:
              jcl_member = f"{SOURCE_DS}(COMPILEJ)"
              content = datasets.read(jcl_member)
              print(f"JCL Member COMPILEJ found. Submitting...")
              job = jobs.submit(jcl_member)
              print(f"Submitted compile job: {job.job_id}")
          except Exception as e:
              print(f"Submit failed: {e}")

          print("=== STEP 6: Wait and Validate ===")
          time.sleep(30)
          res = run_tso("submit 'ZXP.PUBLIC.JCL(CHKREXX2)'")
          print(f"Validation: {res.strip()}")
          print("=== REXX2 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no rexx2.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/rexx2.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/rexx2.py"
