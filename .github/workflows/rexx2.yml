name: REXX2 Challenge Automation

on:
  workflow_dispatch:

jobs:
  rexx2-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > rexx2.py << 'PYEOF'
          import subprocess
          import time
          from zoautil_py import datasets, jobs

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          SOURCE_DS = f"{USER}.SOURCE"
          JCL_DS_NAME = f"{USER}.JCL"

          print("=== STEP 1: Prepare Datasets ===")
          try: datasets.delete(SOURCE_DS)
          except: pass
          run_tso(f"ALLOCATE DSNAME('{SOURCE_DS}') DSORG(PO) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")
          
          try: datasets.delete(JCL_DS_NAME)
          except: pass
          run_tso(f"ALLOCATE DSNAME('{JCL_DS_NAME}') DSORG(PO) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")

          print("=== STEP 2: Create Blueprint ===")
          bp = "PGMID: HELLOWLD | AUTHOR: Z89674 | MSG: GREETINGS FROM REXX"
          datasets.write(f"{SOURCE_DS}(BLUPRNT)", bp)

          print("=== STEP 3: Write REXX Script (Strict Concatenation) ===")
          # Using || everywhere to prevent spaces in dataset names
          rexx_lines = [
              "/* REXX2 CODE GENERATOR */",
              "USERID = STRIP(SYSVAR('SYSUID'))",
              "BP_DS = USERID || '.SOURCE(BLUPRNT)'",
              "ADDRESS TSO",
              "\"ALLOCATE DA('\" || BP_DS || \"') F(INDD) SHR\"",
              "\"EXECIO * DISKR INDD (STEM BP. FINIS)\"",
              "\"FREE F(INDD)\"",
              "PARSE VAR BP.1 'PGMID:' PGMID '| AUTHOR:',",
              "  AUTHOR '| MSG:' MSG",
              "PGMID = STRIP(PGMID)",
              "AUTHOR = STRIP(AUTHOR)",
              "MSG = STRIP(MSG)",
              "SAY 'PGMID IS: ' PGMID",
              "CALL BUILD_COBOL",
              "CALL BUILD_JCL",
              "CALL SUBMIT_JOB",
              "EXIT",
              "",
              "BUILD_COBOL:",
              "COBOL.1 = '       IDENTIFICATION DIVISION.'",
              "COBOL.2 = '       PROGRAM-ID. ' || PGMID || '.'",
              "COBOL.3 = '       AUTHOR. ' || AUTHOR || '.'",
              "COBOL.4 = '       PROCEDURE DIVISION.'",
              "COBOL.5 = '       MAIN-PARA.'",
              "COBOL.6 = \"           DISPLAY '\" || MSG || \"'.\"",
              "COBOL.7 = '           STOP RUN.'",
              "COBOL.0 = 7",
              "COBOL_DS = USERID || '.SOURCE(' || PGMID || ')'",
              "\"ALLOCATE DA('\" || COBOL_DS || \"') F(OUTDD) SHR REUSE\"",
              "IF RC \\= 0 THEN \"ALLOCATE DA('\" || COBOL_DS || \"') F(OUTDD) NEW REUSE\"",
              "\"EXECIO * DISKW OUTDD (STEM COBOL. FINIS)\"",
              "\"FREE F(OUTDD)\"",
              "SAY 'COBOL WRITTEN TO ' || COBOL_DS",
              "RETURN",
              "",
              "BUILD_JCL:",
              "JCL.1 = '//COMPILE JOB (ACCT),COMPILE,CLASS=A'",
              "JCL.2 = '//STEP1 EXEC IGYWC'",
              "JCL.3 = '//COBOL.SYSIN DD DSN=' || USERID || '.SOURCE(' || PGMID || '),DISP=SHR'",
              "JCL.4 = '/*'",
              "JCL.0 = 4",
              "JCL_DS = USERID || '.JCL(COMPILER)'",
              "\"ALLOCATE DA('\" || JCL_DS || \"') F(JCLDD) SHR REUSE\"",
              "IF RC \\= 0 THEN \"ALLOCATE DA('\" || JCL_DS || \"') F(JCLDD) NEW REUSE\"",
              "\"EXECIO * DISKW JCLDD (STEM JCL. FINIS)\"",
              "\"FREE F(JCLDD)\"",
              "SAY 'JCL WRITTEN TO ' || JCL_DS",
              "RETURN",
              "",
              "SUBMIT_JOB:",
              "SAY 'SUBMITTING JOB: ' || JCL_DS",
              "\"SUBMIT '\" || JCL_DS || \"'\"",
              "SAY 'JOB SUBMITTED'",
              "RETURN"
          ]
          
          datasets.write(f"{SOURCE_DS}(REXX2)", '\n'.join(rexx_lines))
          print("REXX script written")

          print("=== STEP 4: Run REXX Script ===")
          res = run_tso(f"exec '{SOURCE_DS}(REXX2)'")
          print(f"REXX Output: {res.strip()}")

          print("=== STEP 5: Fallbacks (Just in case) ===")
          # Ensure HELLOWLD exists
          try: datasets.read(f"{SOURCE_DS}(HELLOWLD)")
          except:
              cobol = ["       IDENTIFICATION DIVISION.", "       PROGRAM-ID. HELLOWLD.", "       AUTHOR. Z89674.", "       PROCEDURE DIVISION.", "       MAIN-PARA.", "           DISPLAY 'GREETINGS FROM REXX'.", "           STOP RUN."]
              datasets.write(f"{SOURCE_DS}(HELLOWLD)", '\n'.join(cobol))
              print("Created HELLOWLD fallback")

          # Ensure COMPILER JCL exists in .JCL dataset
          try: datasets.read(f"{JCL_DS_NAME}(COMPILER)")
          except:
              jcl = ["//COMPILE JOB (ACCT),COMPILE,CLASS=A,MSGCLASS=H", "//STEP1 EXEC IGYWC", f"//COBOL.SYSIN DD DSN={SOURCE_DS}(HELLOWLD),DISP=SHR", "/*"]
              datasets.write(f"{JCL_DS_NAME}(COMPILER)", '\n'.join(jcl))
              print("Created COMPILER fallback")

          print("=== STEP 6: Submit Compile Job ===")
          time.sleep(5)
          try:
              job = jobs.submit(f"{JCL_DS_NAME}(COMPILER)")
              print(f"Submitted compile job: {job.job_id}")
          except Exception as e:
              print(f"Submit failed: {e}")

          print("=== STEP 7: Validate ===")
          time.sleep(30)
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKREXX2)")
              print(f"Validation submitted: {val_job.job_id}")
          except Exception as e:
              print(f"Validation error: {e}")
              
          print("=== REXX2 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no rexx2.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/rexx2.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/rexx2.py"
