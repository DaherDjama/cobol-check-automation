name: NODE1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  node1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Find Node.js and Run Server
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            echo '--- Sourcing profile to load PATH ---'
            source /etc/profile 2>/dev/null || source ~/.profile 2>/dev/null || true
            
            echo '--- Step 1: Finding Node.js installation ---'
            which node
            node --version
            
            echo '--- Step 2: Creating node directory ---'
            mkdir -p /z/z89674/node
            
            echo '--- Step 3: Copying source code from ZXP.PUBLIC.SOURCE(NODE1) ---'
            cat \"//'ZXP.PUBLIC.SOURCE(NODE1)'\" > /z/z89674/node/program1.js
            
            echo '--- Step 4: Modifying code to show actual port ---'
            sed 's/port}/server.address().port}/g' /z/z89674/node/program1.js > /tmp/program1_fixed.js
            mv /tmp/program1_fixed.js /z/z89674/node/program1.js
            
            echo '--- Step 5: Verifying modified code ---'
            sed -n '15p' /z/z89674/node/program1.js
            
            echo '--- Step 6: Starting Node Server ---'
            cd /z/z89674/node
            node program1.js > /tmp/node_output.log 2>&1 &
            SERVER_PID=\$!
            echo \"Server PID: \$SERVER_PID\"
            
            echo '--- Step 7: Waiting 10 seconds for server to start ---'
            sleep 10
            
            echo '--- Step 8: Checking server output ---'
            cat /tmp/node_output.log
            
            echo '--- Step 9: Checking if node process is running ---'
            ps -ef | grep \"program1\" | grep -v grep
            
            echo '--- Step 10: Submitting CHKNODE1 Validation Job ---'
            submit \"//'ZXP.PUBLIC.JCL(CHKNODE1)'\"
            echo 'Validation job submitted!'
          "
