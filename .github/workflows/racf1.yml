name: RACF1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  racf1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > racf1.py << 'PYEOF'
          import subprocess
          import time
          import re
          from zoautil_py import datasets

          def run_cmd(cmd):
              res = subprocess.run(cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          DATASET = f"{USER}.MAGIC"
          JCL_DS = f"{USER}.RACF.JCL"

          print("=== STEP 1: Create sequential dataset Z89674.MAGIC ===")
          run_tso(f"DELETE '{DATASET}'")
          res = run_tso(f"ALLOCATE DSNAME('{DATASET}') DSORG(PS) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")
          print(f"Allocate MAGIC: {res.strip()}")

          print("=== STEP 2: Create JCL dataset ===")
          run_tso(f"DELETE '{JCL_DS}'")
          res = run_tso(f"ALLOCATE DSNAME('{JCL_DS}') DSORG(PS) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")
          print(f"Allocate JCL DS: {res.strip()}")

          print("=== STEP 3: Write RACF JCL ===")
          # Standard JOB card with CLASS=7 (known to work on this system)
          # MSGLEVEL=(1,1) ensures we see messages in the spool
          jcl_content = f"""//RACF1 JOB ,NOTIFY=&SYSUID,CLASS=7,MSGLEVEL=(1,1)
          //STEP1 EXEC PGM=IKJEFT01
          //SYSTSPRT DD SYSOUT=*
          //SYSTSIN DD *
          ADDSD '{DATASET}' UACC(NONE)
          PERMIT '{DATASET}' ID(IBM0001) ACCESS(UPDATE)
          /*
          """
          # Note: The indentation above inside the f-string might be an issue for JCL.
          # Let's use a list to be safe.
          jcl_lines = [
              f"//RACF1 JOB ,NOTIFY=&SYSUID,CLASS=7,MSGLEVEL=(1,1)",
              f"//STEP1 EXEC PGM=IKJEFT01",
              f"//SYSTSPRT DD SYSOUT=*",
              f"//SYSTSIN DD *",
              f"ADDSD '{DATASET}' UACC(NONE)",
              f"PERMIT '{DATASET}' ID(IBM0001) ACCESS(UPDATE)",
              f"/*"
          ]
          jcl_content = "\n".join(jcl_lines)

          try:
              datasets.write(JCL_DS, jcl_content)
              print("JCL written successfully")
          except Exception as e:
              print(f"Error writing JCL: {e}")

          print("=== STEP 4: Submit RACF batch job ===")
          res = run_tso(f"submit '{JCL_DS}'")
          print(f"Submit result: {res.strip()}")

          print("=== STEP 5: Wait for job and capture output ===")
          time.sleep(30)

          # Find the job ID using jls
          jls_out = run_cmd("jls")
          match = re.search(r'RACF1\s+(JOB\d+)', jls_out)
          job_id = None
          if match:
              job_id = match.group(1)
          else:
              # Fallback: take the last job
              matches = re.findall(r'(JOB\d+)', jls_out)
              if matches:
                  job_id = matches[-1]
          
          print(f"Found Job ID: {job_id}")

          if job_id:
              print("--- Capturing SYSTSPRT (TSO Output) ---")
              # Use iconv to convert EBCDIC to readable text
              spool = run_cmd(f"jcat -j {job_id} -d SYSTSPRT 2>/dev/null | iconv -f IBM-1047 -t UTF-8 2>/dev/null")
              print(spool)
              
              print("--- Capturing JESMSGLG (JCL Messages) ---")
              spool_jes = run_cmd(f"jcat -j {job_id} -d JESMSGLG 2>/dev/null | iconv -f IBM-1047 -t UTF-8 2>/dev/null")
              print(spool_jes)

          print("=== STEP 6: Submit Validation Job ===")
          res = run_tso("submit 'ZXP.PUBLIC.JCL(CHKRACF1)'")
          print(res)

          print("=== RACF1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no racf1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/racf1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/racf1.py"
