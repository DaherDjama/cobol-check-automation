name: RACF1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  racf1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > racf1.py << 'PYEOF'
          import subprocess
          import time
          import os

          def run_cmd(cmd):
              res = subprocess.run(cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          DATASET = f"{USER}.MAGIC"

          print("=== STEP 1: Create sequential dataset Z89674.MAGIC ===")
          run_tso(f"DELETE '{DATASET}'")
          res = run_tso(f"ALLOCATE DSNAME('{DATASET}') DSORG(PS) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")
          print(f"Allocate MAGIC: {res.strip()}")

          print("=== STEP 2: Write JCL to USS file (ASCII) ===")
          # Use the exact JOB statement format from the working CHKRACF1 job
          jcl_content = f"""//RACF1 JOB ,MSGLEVEL=(0,0),CLASS=7
          //STEP1 EXEC PGM=IKJEFT01
          //SYSTSPRT DD SYSOUT=*
          //SYSTSIN DD *
          ADDSD '{DATASET}' UACC(NONE)
          PERMIT '{DATASET}' ID(IBM0001) ACCESS(UPDATE)
          /*
          """
          # Note: The indentation in the f-string above will be included. 
          # Let's use a list to ensure column 1 alignment.
          jcl_lines = [
              "//RACF1 JOB ,MSGLEVEL=(0,0),CLASS=7",
              "//STEP1 EXEC PGM=IKJEFT01",
              "//SYSTSPRT DD SYSOUT=*",
              "//SYSTSIN DD *",
              f"ADDSD '{DATASET}' UACC(NONE)",
              f"PERMIT '{DATASET}' ID(IBM0001) ACCESS(UPDATE)",
              "/*"
          ]
          # Join with newlines
          jcl_ascii = "\n".join(jcl_lines) + "\n"
          
          uss_file = '/z/z89674/racf.jcl'
          uss_ebc = '/z/z89674/racf.ebc'
          
          # Clean up old files
          if os.path.exists(uss_file): os.remove(uss_file)
          if os.path.exists(uss_ebc): os.remove(uss_ebc)
          
          with open(uss_file, 'w') as f:
              f.write(jcl_ascii)
          print(f"JCL written to {uss_file}")

          print("=== STEP 3: Convert to EBCDIC and tag ===")
          # Convert ASCII to EBCDIC
          run_cmd(f"iconv -f UTF-8 -t IBM-1047 {uss_file} > {uss_ebc}")
          # Tag the file as EBCDIC so TSO SUBMIT recognizes it
          run_cmd(f"chtag -tc IBM-1047 {uss_ebc}")
          print("Converted and tagged")

          print("=== STEP 4: Submit JCL from USS file ===")
          res = run_tso(f"SUBMIT '{uss_ebc}'")
          print(f"Submit result: {res.strip()}")

          print("=== STEP 5: Wait for job ===")
          time.sleep(30)

          print("=== STEP 6: Submit Validation Job ===")
          res = run_tso("submit 'ZXP.PUBLIC.JCL(CHKRACF1)'")
          print(res)

          print("=== RACF1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no racf1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/racf1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/racf1.py"
