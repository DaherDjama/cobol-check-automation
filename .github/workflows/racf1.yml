
name: RACF1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  racf1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > racf1.py << 'PYEOF'
          import subprocess
          import time

          def run_cmd(cmd):
              """Run shell command"""
              res = subprocess.run(cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          def run_tso(cmd):
              """Run TSO command"""
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          DATASET = f"{USER}.MAGIC"

          print("=== STEP 1: Create sequential dataset Z89674.MAGIC ===")
          run_tso(f"DELETE '{DATASET}'")
          res = run_tso(f"ALLOCATE DSNAME('{DATASET}') DSORG(PS) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")
          print(f"Allocate: {res.strip()}")

          print("=== STEP 2: Write JCL to USS file (ASCII) ===")
          jcl_lines = [
              "//RACF1    JOB ,NOTIFY=&SYSUID",
              "//STEP1    EXEC PGM=IKJEFT01",
              "//SYSTSPRT DD SYSOUT=*",
              "//SYSTSIN  DD *",
              f"ADDSD '{DATASET}' UACC(NONE)",
              f"PERMIT '{DATASET}' ID(IBM0001) ACCESS(UPDATE)",
              "/*"
          ]
          jcl_content = "\n".join(jcl_lines) + "\n"
          
          with open('/z/z89674/RACF1.jcl', 'w') as f:
              f.write(jcl_content)
          print("JCL written to USS file (ASCII)")

          print("=== STEP 3: Convert JCL to EBCDIC ===")
          # Convert ASCII to EBCDIC (IBM-1047) using iconv
          res = run_cmd("iconv -f UTF-8 -t IBM-1047 /z/z89674/RACF1.jcl > /z/z89674/RACF1.ebc 2>&1")
          print(f"Convert result: {res.strip()}")

          print("=== STEP 4: Submit RACF batch job from EBCDIC file ===")
          res = run_tso("submit '/z/z89674/RACF1.ebc'")
          print(f"Submit result: {res.strip()}")

          print("=== STEP 5: Wait for RACF job to finish ===")
          time.sleep(30)

          print("=== STEP 6: Verify RACF profile was created ===")
          res = run_tso(f"LISTDSD DA('{DATASET}') ALL")
          print(f"List result: {res.strip()}")

          print("=== STEP 7: Submit Validation Job (CHKRACF1) ===")
          res = run_tso("submit 'ZXP.PUBLIC.JCL(CHKRACF1)'")
          print(res)
          
          print("=== RACF1 Automation Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no racf1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/racf1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/racf1.py"
