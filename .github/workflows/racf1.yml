name: RACF1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  racf1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > racf1.py << 'PYEOF'
          import subprocess
          import time

          def run_tso(cmd):
              """Helper to run TSO commands"""
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"

          print("=== STEP 1: Create sequential dataset Z89674.magic ===")
          # Delete if exists first
          run_tso(f"DELETE '{USER}.magic'")
          # Allocate a sequential dataset (PS = Physical Sequential)
          res = run_tso(f"ALLOCATE DSNAME('{USER}.magic') DSORG(PS) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")
          print(res)

          print("=== STEP 2: Create RACF JCL file (ensuring column 1 alignment) ===")
          # Use a list of strings to avoid indentation issues in the final JCL
          jcl_lines = [
              f"//RACFJOB  JOB 1,NOTIFY=&SYSUID",
              f"//STEP1    EXEC PGM=IKJEFT01",
              f"//SYSTSPRT DD SYSOUT=*",
              f"//SYSTSIN  DD *",
              f"  ADDSD '{USER}.magic' UACC(NONE)",
              f"  PERMIT '{USER}.magic' ID(IBM0001) ACCESS(UPDATE)",
              f"  LISTDSD DA('{USER}.magic') ALL",
              f"/*"
          ]
          jcl_content = "\n".join(jcl_lines) + "\n"

          # Write to USS file
          with open('/z/z89674/RACFJOB.jcl', 'w') as f:
              f.write(jcl_content)
          print("JCL written to USS file successfully")

          print("=== STEP 3: Copy JCL to dataset using OPUT ===")
          run_tso(f"DELETE '{USER}.JCL(RACFJOB)'")
          res = run_tso(f"OPUT '/z/z89674/RACFJOB.jcl' '{USER}.JCL(RACFJOB)'")
          print(res)

          print("=== STEP 4: Submit RACF batch job ===")
          res = run_tso(f"submit '{USER}.JCL(RACFJOB)'")
          print(res)

          print("=== STEP 5: Wait for RACF job to finish ===")
          time.sleep(30)

          print("=== STEP 6: Submit Validation Job (CHKRACF1) ===")
          res = run_tso("submit 'ZXP.PUBLIC.JCL(CHKRACF1)'")
          print(res)
          
          print("=== RACF1 Automation Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no racf1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/racf1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/racf1.py"
