name: RACF1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  racf1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > racf1.py << 'PYEOF'
          import subprocess
          import time
          from zoautil_py import datasets, jobs

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          MAGIC_DS = f"{USER}.MAGIC"
          JCL_DS = f"{USER}.JCL"

          print("=== STEP 1: Create Z89674.MAGIC Dataset ===")
          try: datasets.delete(MAGIC_DS)
          except: pass
          res = run_tso(f"ALLOCATE DSNAME('{MAGIC_DS}') DSORG(PS) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")
          print(f"Allocate: {res.strip()}")

          print("=== STEP 2: Create JCL for RACF Commands ===")
          # Create a batch job that runs the RACF commands
          racf_jcl = [
              f"//RACFJOB  JOB (ACCT),'RACF SETUP',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID",
              "//STEP1    EXEC PGM=IKJEFT01",
              "//SYSTSPRT DD SYSOUT=*",
              "//SYSTSIN  DD *",
              f"  ADDSD '{MAGIC_DS}' UACC(NONE)",
              f"  PERMIT '{MAGIC_DS}' ID(IBM0001) ACCESS(UPDATE)",
              f"  LISTDSD DA('{MAGIC_DS}') ALL",
              "/*"
          ]
          
          try: datasets.delete(f"{JCL_DS}(RACFJOB)")
          except: pass
          
          # Ensure JCL dataset exists
          try:
              datasets.read(f"{JCL_DS}(TEST)")
          except:
              run_tso(f"ALLOCATE DSNAME('{JCL_DS}') DSORG(PO) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")
          
          datasets.write(f"{JCL_DS}(RACFJOB)", '\n'.join(racf_jcl))
          print("RACF JCL created")

          print("=== STEP 3: Submit RACF Job ===")
          try:
              job = jobs.submit(f"{JCL_DS}(RACFJOB)")
              print(f"RACF job submitted: {job.job_id}")
          except Exception as e:
              print(f"Submit error: {e}")

          print("=== STEP 4: Wait for RACF Job to Complete ===")
          time.sleep(30)

          print("=== STEP 5: Submit Validation Job ===")
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKRACF1)")
              print(f"Validation job submitted: {val_job.job_id}")
          except Exception as e:
              print(f"Validation submit error: {e}")

          print("=== RACF1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no racf1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/racf1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/racf1.py"
