name: RACF1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  racf1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > racf1.py << 'PYEOF'
          import subprocess
          import time

          def run_cmd(cmd):
              res = subprocess.run(cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          DATASET = f"{USER}.MAGIC"

          print("=== STEP 1: Create sequential dataset Z89674.MAGIC ===")
          run_tso(f"DELETE '{DATASET}'")
          res = run_tso(f"ALLOCATE DSNAME('{DATASET}') DSORG(PS) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")
          print(f"Allocate: {res.strip()}")

          print("=== STEP 2: Write JCL to USS file with CRLF and EBCDIC ===")
          # JCL with CRLF line endings (required by mainframe)
          jcl_content = f"//RACF1 JOB (1),'RACF',CLASS=A,MSGCLASS=H,NOTIFY=&SYSUID\r\n"
          jcl_content += f"//STEP1 EXEC PGM=IKJEFT01\r\n"
          jcl_content += f"//SYSTSPRT DD SYSOUT=*\r\n"
          jcl_content += f"//SYSTSIN DD *\r\n"
          jcl_content += f"ADDSD '{DATASET}' UACC(NONE)\r\n"
          jcl_content += f"PERMIT '{DATASET}' ID(IBM0001) ACCESS(UPDATE)\r\n"
          jcl_content += f"/*\r\n"

          # Write to USS file
          with open('/z/z89674/RACF1.jcl', 'wb') as f:
              f.write(jcl_content.encode('latin-1'))
          print("JCL written to USS file with CRLF")

          print("=== STEP 3: Convert to EBCDIC ===")
          res = run_cmd("iconv -f ISO8859-1 -t IBM-1047 /z/z89674/RACF1.jcl > /z/z89674/RACF1.ebc 2>&1")
          print(f"Convert: {res.strip()}")

          print("=== STEP 4: Submit JCL ===")
          res = run_tso("submit '/z/z89674/RACF1.ebc'")
          print(f"Submit result: {res.strip()}")

          print("=== STEP 5: Wait for job ===")
          time.sleep(30)

          print("=== STEP 6: Submit Validation ===")
          res = run_tso("submit 'ZXP.PUBLIC.JCL(CHKRACF1)'")
          print(res)

          print("=== RACF1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no racf1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/racf1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/racf1.py"
