name: RACF1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  racf1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > racf1.py << 'PYEOF'
          import subprocess
          import time
          import codecs

          def run_tso(cmd):
              """Helper to run TSO commands"""
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          DATASET = f"{USER}.MAGIC"

          print("=== STEP 1: Create sequential dataset Z89674.MAGIC ===")
          # Delete if exists first
          run_tso(f"DELETE '{DATASET}'")
          # Allocate the dataset (PS = Physical Sequential)
          res = run_tso(f"ALLOCATE DSNAME('{DATASET}') DSORG(PS) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")
          print(f"Allocate result: {res.strip()}")

          print("=== STEP 2: Write RACF JCL to USS file with EBCDIC encoding ===")
          # Create JCL content
          jcl_content = f"""//RACFJOB JOB ,NOTIFY=&SYSUID
//STEP1 EXEC PGM=IKJEFT01
//SYSTSPRT DD SYSOUT=*
//SYSTSIN DD *
ADDSD '{DATASET}' UACC(NONE)
PERMIT '{DATASET}' ID(IBM0001) ACCESS(UPDATE)
/*
"""
          # Write to USS file with EBCDIC encoding (IBM-1047)
          with codecs.open('/z/z89674/RACFJOB.jcl', 'w', encoding='IBM-1047') as f:
              f.write(jcl_content)
          print("JCL written to USS file with EBCDIC encoding")

          print("=== STEP 3: Submit RACF batch job from USS file ===")
          res = run_tso(f"submit '/z/z89674/RACFJOB.jcl'")
          print(f"Submit result: {res.strip()}")

          print("=== STEP 4: Wait for RACF job to finish ===")
          time.sleep(30)

          print("=== STEP 5: Submit Validation Job (CHKRACF1) ===")
          res = run_tso("submit 'ZXP.PUBLIC.JCL(CHKRACF1)'")
          print(res)
          
          print("=== RACF1 Automation Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no racf1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/racf1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/racf1.py"
