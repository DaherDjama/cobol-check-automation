name: RACF1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  racf1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > racf1.py << 'PYEOF'
          import subprocess
          import time

          def run_cmd(cmd):
              res = subprocess.run(cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          DATASET = f"{USER}.MAGIC"

          print("=== STEP 1: Create sequential dataset Z89674.MAGIC ===")
          run_tso(f"DELETE '{DATASET}'")
          res = run_tso(f"ALLOCATE DSNAME('{DATASET}') DSORG(PS) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")
          print(f"Allocate MAGIC: {res.strip()}")

          print("=== STEP 2: Create JCL PDS ===")
          run_tso(f"DELETE '{USER}.JCL'")
          res = run_tso(f"ALLOCATE DSNAME('{USER}.JCL') DSORG(PO) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")
          print(f"Allocate JCL PDS: {res.strip()}")

          print("=== STEP 3: Write JCL to USS file ===")
          # Write JCL with proper formatting (each line padded to 80 chars)
          jcl_lines = [
              "//RACFJOB JOB ,NOTIFY=&SYSUID,CLASS=7",
              "//STEP1 EXEC PGM=IKJEFT01",
              "//SYSTSPRT DD SYSOUT=*",
              "//SYSTSIN DD *",
              f"ADDSD '{DATASET}' UACC(NONE)",
              f"PERMIT '{DATASET}' ID(IBM0001) ACCESS(UPDATE)",
              "/*"
          ]
          
          # Pad each line to 80 characters
          padded_lines = [line.ljust(80) for line in jcl_lines]
          jcl_content = "\n".join(padded_lines) + "\n"
          
          with open('/z/z89674/RACFJOB.jcl', 'w') as f:
              f.write(jcl_content)
          print("JCL written to USS file")

          print("=== STEP 4: Copy JCL to dataset member using OPUT ===")
          res = run_tso(f"OPUT '/z/z89674/RACFJOB.jcl' '{USER}.JCL(RACFJOB)'")
          print(f"OPUT result: {res.strip()}")

          print("=== STEP 5: Submit RACF batch job ===")
          res = run_tso(f"submit '{USER}.JCL(RACFJOB)'")
          print(f"Submit result: {res.strip()}")

          print("=== STEP 6: Wait for job ===")
          time.sleep(30)

          print("=== STEP 7: Submit Validation Job ===")
          res = run_tso("submit 'ZXP.PUBLIC.JCL(CHKRACF1)'")
          print(res)

          print("=== RACF1 Complete ===")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no racf1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/racf1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/racf1.py"
