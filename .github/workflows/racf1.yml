name: RACF1 Challenge Automation

on:
  workflow_dispatch:

jobs:
  racf1-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > racf1.py << 'PYEOF'
          import subprocess
          import time
          import os

          def run_cmd(cmd):
              res = subprocess.run(cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          def run_tso(cmd):
              full_cmd = f'tso "{cmd}"'
              res = subprocess.run(full_cmd, shell=True, capture_output=True, encoding='latin-1', errors='replace')
              return res.stdout + res.stderr

          USER = "Z89674"
          DATASET = f"{USER}.MAGIC"

          print("=== STEP 1: Create dataset ===")
          run_tso(f"DELETE '{DATASET}'")
          run_tso(f"ALLOCATE DSNAME('{DATASET}') DSORG(PS) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS")

          print("=== STEP 2: Write JCL ===")
          # Use a list of strings to avoid ALL syntax errors
          jcl_lines = [
              f"//RACF1 JOB ,NOTIFY=&SYSUID",
              f"//STEP1 EXEC PGM=IKJEFT01",
              f"//SYSTSPRT DD SYSOUT=*",
              f"//SYSTSIN DD *",
              f"ADDSD '{DATASET}' UACC(NONE)",
              f"PERMIT '{DATASET}' ID(IBM0001) ACCESS(UPDATE)",
              f"/*"
          ]
          jcl_content = "\n".join(jcl_lines) + "\n"
          
          # Clean up old files
          if os.path.exists('/z/z89674/RACF1.jcl'):
              os.remove('/z/z89674/RACF1.jcl')
          if os.path.exists('/z/z89674/RACF1.ebc'):
              os.remove('/z/z89674/RACF1.ebc')

          with open('/z/z89674/RACF1.jcl', 'w') as f:
              f.write(jcl_content)

          print("=== STEP 3: Convert to EBCDIC ===")
          run_cmd("iconv -f UTF-8 -t IBM-1047 /z/z89674/RACF1.jcl > /z/z89674/RACF1.ebc")

          print("=== STEP 4: Submit ===")
          run_tso("submit '/z/z89674/RACF1.ebc'")
          time.sleep(30)

          print("=== STEP 5: Validation ===")
          run_tso("submit 'ZXP.PUBLIC.JCL(CHKRACF1)'")
          PYEOF

      - name: Copy script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no racf1.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/racf1.py

      - name: Execute automation script
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/racf1.py"
