name: ASM2 Challenge Automation

on:
  workflow_dispatch:

jobs:
  asm2-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Modify and Compile Assembler Program
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            echo '=== SOURCING PROFILE ==='
            source /etc/profile 2>/dev/null || true
            
            echo '=== STEP 1: Python Modification ==='
            # We use single quotes for the python command to allow double quotes inside.
            # We use chr(39) to represent the single quote character in the assembler code (e.g. F'4')
            python3 -c '
            from zoautil_py import datasets
            sq = chr(39)
            
            # Read and Modify Source
            s = datasets.read("ZXP.PUBLIC.SOURCE(ASMPGM)")
            s = s.replace("SR 2,2", "SR 7,7")
            s = s.replace("L 2,=C", "L 6,=C")
            s = s.replace("LA 2,=C", "LA 6,=C")
            s = s.replace("L 2,=F" + sq + "4" + sq, "L 6,=F" + sq + "10" + sq)
            s = s.replace("L 3,=F" + sq + "1" + sq, "L 7,=F" + sq + "0" + sq)
            s = s.replace("A 3,=F" + sq + "1" + sq, "A 7,=F" + sq + "5" + sq)
            s = s.replace("BCT 2,LOOP", "BCT 6,LOOP")
            s = s.replace("LH 3,HALFCON", "LH 7,HALFCON")
            s = s.replace("A 3,FULLCON", "A 7,FULLCON")
            s = s.replace("ST 3,HEXCON", "ST 7,HEXCON")
            
            # Write Source (This creates/updates the member in your SOURCE PDS)
            datasets.write("Z89674.SOURCE(ASM2PGM)", s)
            print("Source code updated successfully")
            
            # Read and Modify JCL
            j = datasets.read("ZXP.PUBLIC.JCL(ASMPGM)")
            j = j.replace("ASMPGM", "ASM2PGM")
            
            # Write JCL
            datasets.write("Z89674.JCL(ASM2PGM)", j)
            print("JCL updated successfully")
            '
            
            echo '=== STEP 2: Submitting Compilation Job ==='
            submit \"//'Z89674.JCL(ASM2PGM)'\"
            
            echo '=== STEP 3: Waiting for assembler ==='
            sleep 30
            
            echo '=== STEP 4: Submitting CHKASM2 ==='
            submit \"//'ZXP.PUBLIC.JCL(CHKASM2)'\"
            echo 'Validation job submitted!'
          "
