name: ASM2 Challenge Automation

on:
  workflow_dispatch:

jobs:
  asm2-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > fix_asm.py << 'PYEOF'
          from zoautil_py import datasets
          
          # --- PART 1: Modify Source Code ---
          s = datasets.read("ZXP.PUBLIC.SOURCE(ASMPGM)")
          
          # Replace registers
          s = s.replace(' 2,', ' 6,')  # Reg 2 -> Reg 6
          s = s.replace(',2', ',6')    # Handle second operand like SR 6,2 -> SR 6,6
          s = s.replace(' 3,', ' 7,')  # Reg 3 -> Reg 7
          s = s.replace(',3', ',7')
          
          # Replace values
          s = s.replace("=F'4'", "=F'10'") # Loop count 4 -> 10
          s = s.replace("L 7,=F'1'", "L 7,=F'0'") # Initialize sum to 0
          s = s.replace("A 7,=F'1'", "A 7,=F'5'") # Add 5
          
          # Write to dataset with line truncation
          lines = s.split('\n')
          truncated = [line[:80] for line in lines]
          s_final = '\n'.join(truncated)
          
          datasets.write("Z89674.SOURCE(ASM2PGM)", s_final)
          print("Source code written to dataset")
          
          # --- PART 2: Modify JCL ---
          j = datasets.read("ZXP.PUBLIC.JCL(ASMPGM)")
          j = j.replace("ASMPGM", "ASM2PGM")
          
          lines = j.split('\n')
          truncated = [line[:80] for line in lines]
          j_final = '\n'.join(truncated)
          
          datasets.write("Z89674.JCL(ASM2PGM)", j_final)
          print("JCL written to dataset")
          PYEOF

      - name: Copy script to remote and execute
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no fix_asm.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/fix_asm.py
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/fix_asm.py"
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "submit //'Z89674.JCL(ASM2PGM)'"
          sleep 30
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "submit //'ZXP.PUBLIC.JCL(CHKASM2)'"
          echo 'Validation job submitted!'
