name: ASM2 Challenge Automation

on:
  workflow_dispatch:

jobs:
  asm2-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Modify and Compile Assembler Program
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            echo '=== SOURCING PROFILE ==='
            source /etc/profile 2>/dev/null || true
            
            echo '=== STEP 1: Creating sed script to fix quoting issues ==='
            echo 's/L 2,=C/L 6,=C/g' > /tmp/fix.sed
            echo 's/LA 2,=C/LA 6,=C/g' >> /tmp/fix.sed
            echo 's/SR 2,2/SR 7,7/g' >> /tmp/fix.sed
            echo \"s/L 2,=F'4'/L 6,=F'10'/g\" >> /tmp/fix.sed
            echo \"s/L 3,=F'1'/L 7,=F'0'/g\" >> /tmp/fix.sed
            echo \"s/A 3,=F'1'/A 7,=F'5'/g\" >> /tmp/fix.sed
            echo 's/BCT 2,LOOP/BCT 6,LOOP/g' >> /tmp/fix.sed
            echo 's/LH 3,HALFCON/LH 7,HALFCON/g' >> /tmp/fix.sed
            echo 's/A 3,FULLCON/A 7,FULLCON/g' >> /tmp/fix.sed
            echo 's/ST 3,HEXCON/ST 7,HEXCON/g' >> /tmp/fix.sed
            
            echo '=== STEP 2: Copying and modifying source code ==='
            cat \"//'ZXP.PUBLIC.SOURCE(ASMPGM)'\" > /z/z89674/asm_raw.txt
            sed -f /tmp/fix.sed /z/z89674/asm_raw.txt > /z/z89674/ASM2PGM
            
            echo '=== STEP 3: Verifying modifications ==='
            echo 'Checking for registers 6 and 7:'
            grep -E '(L |LA |SR |A |BCT |LH |ST )[67],' /z/z89674/ASM2PGM | head -10
            echo 'Checking for loop values 10 and 5:'
            grep -E \"=F'(10|5|0)'\" /z/z89674/ASM2PGM
            
            echo '=== STEP 4: Copying to SOURCE dataset using OPUT ==='
            tso \"DELETE 'Z89674.SOURCE(ASM2PGM)'\" 2>/dev/null || echo 'Member did not exist'
            tso \"OPUT '/z/z89674/ASM2PGM' 'Z89674.SOURCE(ASM2PGM)'\"
            
            echo '=== STEP 5: Modifying JCL ==='
            cat \"//'ZXP.PUBLIC.JCL(ASMPGM)'\" > /z/z89674/jcl_raw.txt
            sed 's/ASMPGM/ASM2PGM/g' /z/z89674/jcl_raw.txt > /z/z89674/ASM2JCL
            
            echo '=== STEP 6: Copying JCL to dataset using OPUT ==='
            tso \"DELETE 'Z89674.JCL(ASM2PGM)'\" 2>/dev/null || echo 'JCL member did not exist'
            tso \"OPUT '/z/z89674/ASM2JCL' 'Z89674.JCL(ASM2PGM)'\"
            
            echo '=== STEP 7: Submitting compilation job ==='
            submit \"//'Z89674.JCL(ASM2PGM)'\"
            
            echo '=== STEP 8: Waiting for assembler to finish ==='
            sleep 30
            
            echo '=== STEP 9: Submitting CHKASM2 validation job ==='
            submit \"//'ZXP.PUBLIC.JCL(CHKASM2)'\"
            echo 'Validation job submitted!'
          "
