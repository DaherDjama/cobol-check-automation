name: ASM2 Challenge Automation

on:
  workflow_dispatch:

jobs:
  asm2-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > fix_asm.py << 'PYEOF'
          import re
          from zoautil_py import datasets
          
          # Read the source code
          s = datasets.read("ZXP.PUBLIC.SOURCE(ASMPGM)")
          
          # Replace register 2 with 6 (handling various spacings)
          s = s.replace(' 2,', ' 6,')
          s = s.replace(',2,', ',6,')
          s = s.replace(',2 ', ',6 ')
          
          # Replace register 3 with 7 (handling various spacings)
          s = s.replace(' 3,', ' 7,')
          s = s.replace(',3,', ',7,')
          s = s.replace(',3 ', ',7 ')
          
          # Fix specific values
          s = s.replace("=F'4'", "=F'10'")  # Loop count: 4 -> 10
          
          # Use regex to handle variable spacing (e.g., "L  7,=F'1'")
          s = re.sub(r"L\s+7,=F'1'", "L 7,=F'0'", s)  # Initialize sum to 0
          s = re.sub(r"A\s+7,=F'1'", "A 7,=F'5'", s)  # Add 5 each loop
          
          # Write to dataset with line truncation
          lines = s.split('\n')
          truncated = [line[:80] for line in lines]
          s_final = '\n'.join(truncated)
          
          try:
              datasets.write("Z89674.SOURCE(ASM2PGM)", s_final)
              print("Source code written to dataset successfully")
          except Exception as e:
              print(f"Error writing source: {e}")
              # Fallback: write to USS file
              with open('/z/z89674/ASM2PGM.txt', 'w') as f:
                  f.write(s_final)
              print("Source written to USS file as fallback")
          
          # Do the same for JCL
          j = datasets.read("ZXP.PUBLIC.JCL(ASMPGM)")
          j = j.replace("ASMPGM", "ASM2PGM")
          
          lines = j.split('\n')
          truncated = [line[:80] for line in lines]
          j_final = '\n'.join(truncated)
          
          try:
              datasets.write("Z89674.JCL(ASM2PGM)", j_final)
              print("JCL written to dataset successfully")
          except Exception as e:
              print(f"Error writing JCL: {e}")
              # Fallback: write to USS file
              with open('/z/z89674/ASM2JCL.txt', 'w') as f:
                  f.write(j_final)
              print("JCL written to USS file as fallback")
          PYEOF

      - name: Copy script to remote and execute
        run: |
          # 1. Copy Python script to remote
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no fix_asm.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/fix_asm.py
          
          # 2. Run Python script
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/fix_asm.py"
          
          # 3. If datasets.write failed, use cp to copy USS files to datasets
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            if [ -f /z/z89674/ASM2PGM.txt ]; then
              echo 'Copying source from USS file...'
              tso \"DELETE 'Z89674.SOURCE(ASM2PGM)'\" 2>/dev/null || true
              cp /z/z89674/ASM2PGM.txt '//Z89674.SOURCE(ASM2PGM)' 2>&1
            fi
            if [ -f /z/z89674/ASM2JCL.txt ]; then
              echo 'Copying JCL from USS file...'
              tso \"DELETE 'Z89674.JCL(ASM2PGM)'\" 2>/dev/null || true
              cp /z/z89674/ASM2JCL.txt '//Z89674.JCL(ASM2PGM)' 2>&1
            fi
          "
          
          # 4. Verify the dataset content
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            echo '=== SOURCE DATASET CONTENT (first 30 lines) ==='
            head -30 \"//'Z89674.SOURCE(ASM2PGM)'\" 2>&1 || echo 'Could not read dataset'
          "
          
          # 5. Submit Compilation Job
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "submit //'Z89674.JCL(ASM2PGM)'"
          
          # 6. Wait for assembler
          sleep 30
          
          # 7. Submit Validation Job
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "submit //'ZXP.PUBLIC.JCL(CHKASM2)'"
          echo 'Validation job submitted!'
