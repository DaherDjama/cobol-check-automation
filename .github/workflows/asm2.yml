name: ASM2 Challenge Automation

on:
  workflow_dispatch:

jobs:
  asm2-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > fix_asm.py << 'PYEOF'
          from zoautil_py import datasets
          
          # --- PART 1: Modify Source Code ---
          s = datasets.read("ZXP.PUBLIC.SOURCE(ASMPGM)")
          
          # Replace registers
          s = s.replace(' 2,', ' 6,')  # Reg 2 -> Reg 6
          s = s.replace(',2', ',6')    # Handle second operand like SR 6,2 -> SR 6,6
          s = s.replace(' 3,', ' 7,')  # Reg 3 -> Reg 7
          s = s.replace(',3', ',7')
          
          # Replace values
          s = s.replace("=F'4'", "=F'10'") # Loop count 4 -> 10
          s = s.replace("L 7,=F'1'", "L 7,=F'0'") # Initialize sum to 0
          s = s.replace("A 7,=F'1'", "A 7,=F'5'") # Add 5
          
          # Write to USS text file (truncating lines to 80 chars)
          with open('/z/z89674/ASM2PGM.txt', 'w') as f:
              for line in s.split('\n'):
                  f.write(line[:80] + '\n')
          print("Source USS file created")
          
          # --- PART 2: Modify JCL ---
          j = datasets.read("ZXP.PUBLIC.JCL(ASMPGM)")
          j = j.replace("ASMPGM", "ASM2PGM")
          
          # Write to USS text file
          with open('/z/z89674/ASM2JCL.txt', 'w') as f:
              for line in j.split('\n'):
                  f.write(line[:80] + '\n')
          print("JCL USS file created")
          PYEOF

      - name: Copy script, prepare datasets, and execute
        run: |
          # 1. Copy Python script to remote
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no fix_asm.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/fix_asm.py
          
          # 2. Run Python script to create USS files
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/fix_asm.py"
          
          # 3. Create/Ensure datasets exist with correct attributes (LRECL=80)
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            tso \"ALLOCATE DATASET('Z89674.SOURCE') DSORG(PO) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS\" 2>/dev/null || echo 'SOURCE dataset ready'
            tso \"ALLOCATE DATASET('Z89674.JCL') DSORG(PO) RECFM(F,B) LRECL(80) SPACE(1,1) TRACKS\" 2>/dev/null || echo 'JCL dataset ready'
          "
          
          # 4. Copy USS files to Datasets using cp (handles text-to-record conversion)
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            cp -F recfm=fb,lrecl=80 /z/z89674/ASM2PGM.txt '//Z89674.SOURCE(ASM2PGM)'
            echo 'Source copied to dataset'
            cp -F recfm=fb,lrecl=80 /z/z89674/ASM2JCL.txt '//Z89674.JCL(ASM2PGM)'
            echo 'JCL copied to dataset'
          "
          
          # 5. Submit Compilation Job
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "submit //'Z89674.JCL(ASM2PGM)'"
          
          # 6. Wait for assembler
          sleep 30
          
          # 7. Submit Validation Job
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "submit //'ZXP.PUBLIC.JCL(CHKASM2)'"
          echo 'Validation job submitted!'
