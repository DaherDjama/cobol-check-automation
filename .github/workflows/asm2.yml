name: ASM2 Challenge Automation

on:
  workflow_dispatch:

jobs:
  asm2-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Modify and Compile Assembler Program
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            echo '=== SOURCING PROFILE ==='
            source /etc/profile 2>/dev/null || true
            
            echo '=== STEP 1: Copy source code to USS ==='
            cat \"//'ZXP.PUBLIC.SOURCE(ASMPGM)'\" > /z/z89674/asm_raw.txt
            echo 'Source file lines:'
            wc -l /z/z89674/asm_raw.txt
            
            echo '=== STEP 2: Create Python script to do replacements ==='
            echo 'import sys' > /z/z89674/fix_asm.py
            echo 'from zoautil_py import datasets' >> /z/z89674/fix_asm.py
            echo '' >> /z/z89674/fix_asm.py
            echo '# Read the source file' >> /z/z89674/fix_asm.py
            echo 'with open(\"/z/z89674/asm_raw.txt\", \"r\") as f:' >> /z/z89674/fix_asm.py
            echo '    content = f.read()' >> /z/z89674/fix_asm.py
            echo '' >> /z/z89674/fix_asm.py
            echo '# Do the replacements' >> /z/z89674/fix_asm.py
            echo 'content = content.replace(\"L 2,=C\", \"L 6,=C\")' >> /z/z89674/fix_asm.py
            echo 'content = content.replace(\"LA 2,=C\", \"LA 6,=C\")' >> /z/z89674/fix_asm.py
            echo 'content = content.replace(\"SR 2,2\", \"SR 7,7\")' >> /z/z89674/fix_asm.py
            echo 'content = content.replace(\"L 2,=F\\'4\\'\", \"L 6,=F\\'10\\'\")' >> /z/z89674/fix_asm.py
            echo 'content = content.replace(\"L 3,=F\\'1\\'\", \"L 7,=F\\'0\\'\")' >> /z/z89674/fix_asm.py
            echo 'content = content.replace(\"A 3,=F\\'1\\'\", \"A 7,=F\\'5\\'\")' >> /z/z89674/fix_asm.py
            echo 'content = content.replace(\"BCT 2,LOOP\", \"BCT 6,LOOP\")' >> /z/z89674/fix_asm.py
            echo 'content = content.replace(\"LH 3,HALFCON\", \"LH 7,HALFCON\")' >> /z/z89674/fix_asm.py
            echo 'content = content.replace(\"A 3,FULLCON\", \"A 7,FULLCON\")' >> /z/z89674/fix_asm.py
            echo 'content = content.replace(\"ST 3,HEXCON\", \"ST 7,HEXCON\")' >> /z/z89674/fix_asm.py
            echo '' >> /z/z89674/fix_asm.py
            echo '# Write the modified content' >> /z/z89674/fix_asm.py
            echo 'with open(\"/z/z89674/ASM2PGM\", \"w\") as f:' >> /z/z89674/fix_asm.py
            echo '    f.write(content)' >> /z/z89674/fix_asm.py
            echo '' >> /z/z89674/fix_asm.py
            echo '# Copy to SOURCE dataset' >> /z/z89674/fix_asm.py
            echo 'datasets.write(\"Z89674.SOURCE(ASM2PGM)\", content)' >> /z/z89674/fix_asm.py
            echo 'print(\"SOURCE dataset member created\")' >> /z/z89674/fix_asm.py
            
            echo '=== STEP 3: Run Python script to modify and copy ==='
            cd /z/z89674
            python3 fix_asm.py 2>&1
            
            echo '=== STEP 4: Verify modifications ==='
            echo 'Checking for registers 6 and 7:'
            grep -E '(L|LA|SR|A|BCT|LH|ST)[[:space:]]+[67],' /z/z89674/ASM2PGM | head -10
            echo 'Checking for loop values:'
            grep -E \"=F'(10|5|0)'\" /z/z89674/ASM2PGM
            
            echo '=== STEP 5: Verify SOURCE dataset ==='
            cat \"//'Z89674.SOURCE(ASM2PGM)'\" | head -20
            
            echo '=== STEP 6: Create Python script to modify JCL ==='
            echo 'import sys' > /z/z89674/fix_jcl.py
            echo 'from zoautil_py import datasets' >> /z/z89674/fix_jcl.py
            echo '' >> /z/z89674/fix_jcl.py
            echo '# Read the JCL' >> /z/z89674/fix_jcl.py
            echo 'jcl_content = datasets.read(\"ZXP.PUBLIC.JCL(ASMPGM)\")' >> /z/z89674/fix_jcl.py
            echo '' >> /z/z89674/fix_jcl.py
            echo '# Replace ASMPGM with ASM2PGM' >> /z/z89674/fix_jcl.py
            echo 'jcl_content = jcl_content.replace(\"ASMPGM\", \"ASM2PGM\")' >> /z/z89674/fix_jcl.py
            echo '' >> /z/z89674/fix_jcl.py
            echo '# Write to JCL dataset' >> /z/z89674/fix_jcl.py
            echo 'datasets.write(\"Z89674.JCL(ASM2PGM)\", jcl_content)' >> /z/z89674/fix_jcl.py
            echo 'print(\"JCL dataset member created\")' >> /z/z89674/fix_jcl.py
            
            echo '=== STEP 7: Run Python script to modify and copy JCL ==='
            python3 fix_jcl.py 2>&1
            
            echo '=== STEP 8: Verify JCL dataset ==='
            cat \"//'Z89674.JCL(ASM2PGM)'\" | head -20
            
            echo '=== STEP 9: Submit compilation job ==='
            submit \"//'Z89674.JCL(ASM2PGM)'\"
            
            echo '=== STEP 10: Waiting for assembler ==='
            sleep 30
            
            echo '=== STEP 11: Submitting CHKASM2 ==='
            submit \"//'ZXP.PUBLIC.JCL(CHKASM2)'\"
            echo 'Validation job submitted!'
          "
