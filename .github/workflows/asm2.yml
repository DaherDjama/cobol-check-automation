
name: ASM2 Challenge Automation

on:
  workflow_dispatch:

jobs:
  asm2-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > fix_asm.py << 'PYEOF'
          from zoautil_py import datasets
          import re
          
          s = datasets.read("ZXP.PUBLIC.SOURCE(ASMPGM)")
          
          print("=== ORIGINAL CODE (relevant lines) ===")
          lines = s.split('\n')
          for i, line in enumerate(lines):
              if ' 2,' in line or ' 3,' in line or '=F' in line:
                  print(f"{i}: {repr(line)}")
          
          # 1. Register Replacements
          # Replace ' 2,' with ' 6,' (handles first operand like L 2,...)
          s = s.replace(' 2,', ' 6,')
          # Replace ',2' with ',6' (handles second operand like SR 6,2 -> SR 6,6)
          s = s.replace(',2', ',6')
          
          # Replace ' 3,' with ' 7,'
          s = s.replace(' 3,', ' 7,')
          # Replace ',3' with ',7'
          s = s.replace(',3', ',7')
          
          # 2. Value Replacements
          # Loop count: =F'4' -> =F'10'
          s = s.replace("=F'4'", "=F'10'")
          
          # Sum Initialization: L (spaces) 7,=F'1' -> L 7,=F'0'
          # Using regex to handle variable spacing (e.g. "L  7,=F'1'")
          s = re.sub(r'L\s+7,=F\'1\'', "L 7,=F'0'", s)
          
          # Add Value: A (spaces) 7,=F'1' -> A 7,=F'5'
          s = re.sub(r'A\s+7,=F\'1\'', "A 7,=F'5'", s)
          
          print("\n=== MODIFIED CODE (relevant lines) ===")
          lines = s.split('\n')
          for i, line in enumerate(lines):
              if ' 6,' in line or ' 7,' in line or '=F' in line:
                  print(f"{i}: {repr(line)}")
          
          # Truncate lines to 80 chars
          lines = s.split('\n')
          truncated = [line[:80] for line in lines]
          s_final = '\n'.join(truncated)
          
          datasets.write("Z89674.SOURCE(ASM2PGM)", s_final)
          print("\nSource code updated successfully")
          
          # JCL Modification
          j = datasets.read("ZXP.PUBLIC.JCL(ASMPGM)")
          lines = j.split('\n')
          new_lines = []
          for line in lines:
              new_line = line.replace("ASMPGM", "ASM2PGM")
              if len(new_line) > 80:
                  new_line = new_line[:80]
              new_lines.append(new_line)
          j_fixed = '\n'.join(new_lines)
          datasets.write("Z89674.JCL(ASM2PGM)", j_fixed)
          print("JCL updated successfully")
          PYEOF

      - name: Copy script to remote and execute
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no fix_asm.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/fix_asm.py
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/fix_asm.py"
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "submit //'Z89674.JCL(ASM2PGM)'"
          sleep 30
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "submit //'ZXP.PUBLIC.JCL(CHKASM2)'"
          echo 'Validation job submitted!'
