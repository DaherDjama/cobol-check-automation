name: ASM2 Challenge Automation

on:
  workflow_dispatch:

jobs:
  asm2-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create Python script locally
        run: |
          cat > fix_asm.py << 'PYEOF'
          import re
          from zoautil_py import datasets
          
          # Read the SOURCE code
          s = datasets.read("ZXP.PUBLIC.SOURCE(ASMPGM)")
          
          # Apply register replacements to SOURCE
          s = s.replace(' 2,', ' 6,')
          s = s.replace(',2,', ',6,')
          s = s.replace(',2 ', ',6 ')
          s = s.replace(' 3,', ' 7,')
          s = s.replace(',3,', ',7,')
          s = s.replace(',3 ', ',7 ')
          s = s.replace("=F'4'", "=F'10'")
          s = re.sub(r"L\s+7,=F'1'", "L 7,=F'0'", s)
          s = re.sub(r"A\s+7,=F'1'", "A 7,=F'5'", s)
          
          # Write modified SOURCE to dataset
          lines = s.split('\n')
          truncated = [line[:80] for line in lines]
          s_final = '\n'.join(truncated)
          datasets.write("Z89674.SOURCE(ASM2PGM)", s_final)
          print("Source code written to dataset successfully")
          
          # Read the JCL (which contains inline source code)
          j = datasets.read("ZXP.PUBLIC.JCL(ASMPGM)")
          
          # Replace member name references
          j = j.replace("ASMPGM", "ASM2PGM")
          
          # ALSO apply register replacements to the inline source code within JCL
          j = j.replace(' 2,', ' 6,')
          j = j.replace(',2,', ',6,')
          j = j.replace(',2 ', ',6 ')
          j = j.replace(' 3,', ' 7,')
          j = j.replace(',3,', ',7,')
          j = j.replace(',3 ', ',7 ')
          j = j.replace("=F'4'", "=F'10'")
          j = re.sub(r"L\s+7,=F'1'", "L 7,=F'0'", j)
          j = re.sub(r"A\s+7,=F'1'", "A 7,=F'5'", j)
          
          # Write modified JCL to dataset
          lines = j.split('\n')
          truncated = [line[:80] for line in lines]
          j_final = '\n'.join(truncated)
          datasets.write("Z89674.JCL(ASM2PGM)", j_final)
          print("JCL written to dataset successfully")
          PYEOF

      - name: Copy Python script to remote
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no fix_asm.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/fix_asm.py

      - name: Run Python script to modify code
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/fix_asm.py"

      - name: Delete old load modules
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
            echo 'Deleting old load modules...'
            tso \"DELETE 'Z89674.LOADLIB(ASM2PGM)'\" 2>/dev/null || echo 'LOADLIB member did not exist'
            tso \"DELETE 'Z89674.OBJLIB(ASM2PGM)'\" 2>/dev/null || echo 'OBJLIB member did not exist'
          "

      - name: Verify JCL dataset content
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cat \"//'Z89674.JCL(ASM2PGM)'\""

      - name: Submit compilation job
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "submit //'Z89674.JCL(ASM2PGM)'"

      - name: Wait for assembler to finish
        run: sleep 45

      - name: Submit validation job
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "submit //'ZXP.PUBLIC.JCL(CHKASM2)'"
          echo 'Validation job submitted!'
