name: NODE2 Challenge Automation

on:
  workflow_dispatch:

jobs:
  node2-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Create program2.js locally
        run: |
          mkdir -p node
          cat > node/program2.js << 'JSEOF'
          const http = require('http');
          const { datasets } = require("zoau");

          const port = process.env.PORT || 89674;
          const myname = process.env.LOGNAME || 'Z89674'; 

          function sendResponse(res, content, code, type) {
              res.statusCode = code;
              res.setHeader('Content-Type', type || 'text/plain');
              res.end(content);
          }

          const server = http.createServer((req, res) => {
              const basic = /^\/$/;
              const hello = /^\/hello\//;
              const data = /^\/data\/.*/;

              if (req.url === '/favicon.ico') {
                  res.statusCode = 204;
                  res.end();
                  return;
              }

              if (basic.test(req.url)) {
                  sendResponse(res, `Hello World from ${myname} on z/OS`, 200, 'text/plain');
              } 
              else if (hello.test(req.url)) {
                  const name = req.url.replace(/^\/hello\/([A-Za-z0-9]+).*$/, '$1');
                  sendResponse(res, `Hello ${name}!`, 200, 'text/plain');
              } 
              else if (data.test(req.url)) {
                  const member = req.url.replace(/^\/data\/([A-Za-z0-9]+).*$/, '$1');
                  const dsn = `ZXP.PUBLIC.SOURCE(${member})`;
                  
                  datasets.read(dsn)
                      .then(function(contents) {
                          sendResponse(res, contents, 200, "text/plain");
                      })
                      .catch(function(error) {
                          sendResponse(res, `${dsn} not found`, 404, "text/plain");
                      });
              } 
              else {
                  sendResponse(res, 'Not Found', 404, 'text/plain');
              }
          });

          server.listen(port, () => {
              console.log(`Server running at http://0.0.0.0:${port}/`);
          });
          JSEOF

      - name: Create start_node.py locally
        run: |
          cat > node/start_node.py << 'PYEOF'
          import os
          import subprocess
          import time

          # 1. Setup Environment
          os.environ['PATH'] = '/global/node/bin:' + os.environ.get('PATH', '')
          os.environ['NODE_PATH'] = '/global/node/lib/node_modules'

          # 2. Kill old processes
          print("Killing old processes...")
          subprocess.run("ps -ef | grep program2.js | grep -v grep | awk '{print $2}' | xargs kill 2>/dev/null", shell=True)
          time.sleep(2)

          # 3. Ensure directory exists and change to it
          node_dir = '/z/z89674/node'
          os.makedirs(node_dir, exist_ok=True)
          os.chdir(node_dir)

          # 4. Start Server in background
          print("Starting Node server...")
          log_file = open('server.log', 'w')
          # start_new_session=True acts like nohup/disown
          subprocess.Popen(['node', 'program2.js'], stdout=log_file, stderr=log_file, start_new_session=True)
          log_file.close()

          # 5. Wait and print log
          time.sleep(5)
          print("--- SERVER LOG ---")
          with open('server.log', 'r') as f:
              print(f.read())
          print("------------------")
          PYEOF

      - name: Copy files to z/OS
        run: |
          # Create directory
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "mkdir -p /z/z89674/node"
          
          # Copy files
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no node/program2.js ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/node/program2.js
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no node/start_node.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/start_node.py
          
          echo "Files copied"

      - name: Start Server using Python
        run: |
          # Run the python script to start the server
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/start_node.py"

      - name: Submit Validation Job
        run: |
          cat > validate_node2.py << 'PYEOF'
          from zoautil_py import jobs
          try:
              val_job = jobs.submit("ZXP.PUBLIC.JCL(CHKNODE2)")
              print(f"Validation job submitted: {val_job.job_id}")
          except Exception as e:
              print(f"Validation submit error: {e}")
          PYEOF
          
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no validate_node2.py ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/z/z89674/validate_node2.py
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "source /etc/profile 2>/dev/null || true; python3 /z/z89674/validate_node2.py"
