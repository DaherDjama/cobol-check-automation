name: JCL2 Challenge Automation

on:
  workflow_dispatch:

jobs:
  jcl2-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get install -y sshpass

      - name: Copy JCL and Investigate
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "
          echo '--- Step 1: Copying JES2JOB1 to your JCL dataset ---'
          cp \"//'ZXP.PUBLIC.JCL(JES2JOB1)'\" \"//'Z89674.JCL(JES2JOB1)'\"
          
          echo '--- Step 2: Current JCL Content ---'
          cat \"//'Z89674.JCL(JES2JOB1)'\"
          
          echo '--- Step 3: Files available in ZXP.PUBLIC.SOURCE ---'
          tso \"LISTDS 'ZXP.PUBLIC.SOURCE' MEMBERS\" 2>&1 | grep -v 'IKJ' | grep -v 'READY' | grep -v 'RETURN' | grep -v 'TSO'
          
          echo '--- Step 4: Submitting the broken job ---'
          submit \"//'Z89674.JCL(JES2JOB1)'\"
          echo 'Job submitted! Check logs for the Job ID.'
          "
